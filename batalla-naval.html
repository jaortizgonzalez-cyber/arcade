<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla naval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  main{max-width:440px;margin:0 auto}
  [data-juego]{display:flex;flex-direction:column;gap:10px}

  /* Banner de turno */
  #banner{border-radius:14px;padding:12px;text-align:center;background:var(--panel);
          border:2px solid var(--borde);transition:background .2s,border-color .2s;
          position:relative}
  #b-son{position:absolute;right:8px;top:50%;transform:translateY(-50%);
         background:none;border:none;font-size:17px;padding:8px;cursor:pointer;opacity:.75}
  #b-son:hover{opacity:1}
  #banner b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.2}
  #banner span{font-size:12px;color:var(--tenue)}
  #banner.mio{background:#4A3A16;border-color:var(--ambar)}
  #banner.mio b{color:var(--ambar)}
  #banner.gane{background:#1E4A3C;border-color:var(--menta)}
  #banner.gane b{color:var(--menta)}

  /* Rótulos de sección */
  .seccion{display:flex;justify-content:space-between;align-items:baseline;
           margin-top:6px;gap:8px}
  .seccion h2{font-family:var(--display);font-weight:800;font-size:15px}
  .seccion span{font-size:11px;color:var(--tenue);letter-spacing:.06em;
                text-transform:uppercase;white-space:nowrap}

  /* Cuadrículas con coordenadas */
  .tabla{display:grid;grid-template-columns:16px repeat(10,1fr);gap:2px}
  .eje{font-size:8px;color:var(--tenue);display:grid;place-items:center;line-height:1}
  .celda{background:#2C1B42;border:1px solid #3E2A5A;border-radius:3px;padding:0;
         aspect-ratio:1;display:grid;place-items:center;cursor:pointer;position:relative}
  .celda:disabled{cursor:default}
  .celda.barco{background:#5A4080;border-color:#7B59AB}
  .celda.previa{background:#4A3570;border-color:var(--ambar)}
  .celda.mala{background:#5A2B3C;border-color:var(--rojo)}
  /* El mar enemigo es la zona jugable: se destaca y respira cuando es tu turno */
  .tabla.rival{padding:6px;border-radius:14px;
               background:rgba(110,150,255,.07);
               box-shadow:0 0 0 2px rgba(122,160,255,.22);
               transition:box-shadow .4s,background .4s}
  .tabla.rival.activo{background:rgba(110,150,255,.13);
                      animation:respirar 2.6s ease-in-out infinite}
  @keyframes respirar{
    0%,100%{box-shadow:0 0 0 2px rgba(122,160,255,.45), 0 0 16px rgba(122,160,255,.18)}
    50%    {box-shadow:0 0 0 2px rgba(122,160,255,.85), 0 0 30px rgba(122,160,255,.45)}}
  .rival .celda{background:#352456;border-color:#4C3672}
  .rival .celda:not(:disabled){cursor:crosshair}
  .rival .celda:not(:disabled):hover{background:#4B3578;border-color:var(--ambar);
                                     transform:scale(1.08);z-index:3}

  /* Tu flota es solo informativa: queda un paso atrás */
  .mini .tabla{opacity:.62;filter:saturate(.9);transition:opacity .25s}
  .mini:hover .tabla{opacity:1}

  /* Clavijas: blanca = agua, roja = tocado (como el juego de mesa) */
  .clavija{width:46%;height:46%;border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,.45)}
  .agua .clavija{background:#E8E2F5}
  .tocado .clavija{background:var(--rojo);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
  .celda.hundido{background:#7A2733;border-color:#A33}
  .celda.ultimo{outline:2px solid var(--ambar);outline-offset:1px;z-index:2;
                animation:pulso 1s ease-out 3}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,201,74,.9)}
                   70%{box-shadow:0 0 0 9px rgba(255,201,74,0)}
                   100%{box-shadow:0 0 0 0 rgba(255,201,74,0)}}

  /* Aviso emergente del disparo */
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140%);
         z-index:50;width:calc(100% - 28px);max-width:400px;
         border-radius:16px;padding:14px 16px;text-align:center;
         background:var(--panel);border:2px solid var(--borde);
         box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s ease-out}
  #toast.ver{transform:translateX(-50%) translateY(0)}
  #toast b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2}
  #toast span{font-size:13px;color:var(--tenue)}
  #toast.tocado{background:#4A1E28;border-color:var(--rojo)}
  #toast.tocado b{color:var(--rojo)}
  #toast.agua{background:#26304A;border-color:#7B8BC4}
  #toast.agua b{color:#C9D4F5}

  /* Bitácora */
  #bitacora{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:4px}
  #bitacora li{font-size:12px;color:var(--tenue);background:var(--panel);
               border-radius:9px;padding:7px 10px;display:flex;
               justify-content:space-between;gap:8px;border-left:3px solid var(--borde)}
  #bitacora li.yo{border-left-color:var(--ambar)}
  #bitacora li.el{border-left-color:#7B8BC4}
  #bitacora b{color:var(--tinta);font-weight:700}
  #bitacora .r{color:var(--rojo);font-weight:700}

  .mini{max-width:190px;margin:0 auto}
  .leyenda{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--tenue);margin-top:6px}
  .leyenda i{display:inline-block;width:9px;height:9px;border-radius:50%;
             vertical-align:middle;margin-right:4px}
  .leyenda .b{background:#E8E2F5} .leyenda .r{background:var(--rojo)}
  .leyenda .s{background:#5A4080;border-radius:2px}

  /* Barcos */
  .flota{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
  .barco-chip{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
              padding:6px 9px;border-radius:10px;border:2px solid var(--borde);
              background:var(--panel);color:var(--tinta);cursor:default}
  button.barco-chip{cursor:pointer}
  .barco-chip.sel{border-color:var(--ambar);background:#4A3A16}
  .barco-chip.puesto .casillas i{background:var(--menta)}
  .barco-chip.roto{color:var(--rojo);border-color:#6B2A34;background:#3A1E28;opacity:.8}
  .barco-chip.roto .casillas i{background:var(--rojo)}
  .barco-chip .casillas{display:flex;gap:2px}
  .barco-chip .casillas i{width:6px;height:6px;border-radius:2px;background:#7B59AB}
  .barco-chip .silueta{display:flex;width:26px}
  .barco-chip .silueta svg{width:100%;height:auto;fill:currentColor}
  .barco-chip .tic{font-size:10px;opacity:.85}
  .barco-chip.roto .silueta{opacity:.6}

  .fila-botones{display:flex;gap:8px;margin-top:10px}
  .fila-botones .accion{font-size:14px;padding:13px}
  .ayuda{font-size:12px;color:var(--tenue);text-align:center;line-height:1.45}

  /* ── Pantalla de victoria / derrota ── */
  #final{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;
         background:rgba(16,8,28,.82);backdrop-filter:blur(6px);
         animation:aparecer .35s ease-out}
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  .tarjeta-final{width:100%;max-width:420px;background:var(--panel);
                 border:2px solid var(--borde);border-radius:24px;overflow:hidden;
                 box-shadow:0 24px 70px rgba(0,0,0,.6);
                 animation:subir .45s cubic-bezier(.2,1.3,.4,1)}
  @keyframes subir{from{transform:translateY(30px) scale(.92);opacity:0}
                   to{transform:none;opacity:1}}
  .escena{display:block;width:100%;height:auto;background:#0E1230}
  .tarjeta-final .cuerpo{padding:20px 20px 22px;text-align:center}
  .tarjeta-final h2{font-family:var(--display);font-weight:800;font-size:29px;
                    line-height:1.1;margin-bottom:6px}
  .gane .tarjeta-final h2{color:var(--ambar)}
  .perdio .tarjeta-final h2{color:#9FB4E8}
  .tarjeta-final .sub{font-size:14px;color:var(--tenue);line-height:1.5}
  .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
  .cifra{background:rgba(0,0,0,.25);border-radius:13px;padding:10px 4px}
  .cifra b{display:block;font-family:var(--display);font-weight:800;font-size:21px}
  .cifra span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
  .tarjeta-final .accion + .accion{margin-top:8px}

  /* Animaciones de la escena */
  .barco-hundido{animation:hundirse 4s ease-in-out infinite}
  @keyframes hundirse{0%,100%{transform:translateY(0) rotate(0deg)}
                      50%{transform:translateY(5px) rotate(-3deg)}}
  .llama{transform-origin:center bottom;animation:arder .5s ease-in-out infinite alternate}
  @keyframes arder{from{transform:scaleY(.82) scaleX(1.05);opacity:.85}
                   to{transform:scaleY(1.15);opacity:1}}
  .ola{animation:ondear 3.5s ease-in-out infinite}
  .ola2{animation:ondear 4.5s ease-in-out infinite reverse}
  @keyframes ondear{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
  .destello{animation:brillar 2.5s ease-in-out infinite}
  @keyframes brillar{0%,100%{opacity:.35}50%{opacity:.9}}

  .editar-nom{background:none;border:none;color:inherit;font:inherit;
              text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
              opacity:.8;padding:2px}
  .editar-nom:hover{opacity:1;text-decoration:underline}

  /* En pantallas anchas los dos mares caben lado a lado: sin scroll */
  @media (min-width:900px){
    main{max-width:960px}
    #zona-combate:not([hidden]),
    #zona-colocar:not([hidden]){display:grid;grid-template-columns:1fr 1fr;
                                gap:26px;align-items:start}
    .mini{max-width:none}
    .col > :first-child{margin-top:0}
    .col-ctrl{display:flex;flex-direction:column;justify-content:center;min-height:100%}
  }
</style>
</head>
<body>
<div id="toast"><b id="toast-t"></b><span id="toast-s"></span></div>
<main>
  <div id="lobby"></div>

  <section data-juego hidden>
    <div class="marcador">
      <div class="jugador" data-rol="A" id="tj-A">
        <div class="nom" id="nom-A">—</div>
        <div class="puntos" id="pt-A">0</div>
        <div class="yo" id="yo-A">&nbsp;</div>
      </div>
      <div class="centro-info">Batallas<b id="pt-tot">0</b></div>
      <div class="jugador" data-rol="B" id="tj-B">
        <div class="nom" id="nom-B">—</div>
        <div class="puntos" id="pt-B">0</div>
        <div class="yo" id="yo-B">&nbsp;</div>
      </div>
    </div>

    <div id="banner">
      <b id="banner-t">—</b><span id="banner-s"></span>
      <button id="b-son" aria-label="Activar o silenciar sonido">🔊</button>
    </div>

    <!-- COLOCACIÓN -->
    <div id="zona-colocar" hidden>
      <div class="col">
        <div class="seccion">
          <h2>Coloca tu flota</h2>
          <span id="orientacion">Horizontal</span>
        </div>
        <div class="tabla" id="malla-propia-col"></div>
      </div>
      <div class="col col-ctrl">
        <p class="ayuda">Elige un barco y toca el mar para ubicarlo.<br>
           Para moverlo, tócalo otra vez en la lista.</p>
        <div class="flota" id="flota-chips"></div>
        <div class="fila-botones">
          <button class="accion fantasma" id="b-rotar">⟳ Rotar</button>
          <button class="accion fantasma" id="b-azar">🎲 Al azar</button>
        </div>
        <button class="accion" id="b-listo" style="margin-top:8px" disabled>Listo, ¡a zarpar!</button>
      </div>
    </div>

    <!-- COMBATE -->
    <div id="zona-combate" hidden>
      <div class="col">
      <div class="seccion">
        <h2>🎯 Mar enemigo</h2>
        <span id="restantes-rival"></span>
      </div>
      <div class="tabla rival" id="malla-rival"></div>
      <div class="leyenda">
        <span><i class="b"></i>agua</span>
        <span><i class="r"></i>tocado</span>
      </div>
      <div class="flota" id="flota-rival"></div>
      </div>

      <div class="col">
      <div class="seccion" style="margin-top:14px">
        <h2>⚓ Tu flota</h2>
        <span id="restantes-propio"></span>
      </div>
      <div class="mini"><div class="tabla" id="malla-propia"></div></div>
      <div class="leyenda">
        <span><i class="s"></i>tus barcos</span>
        <span><i class="b"></i>falló</span>
        <span><i class="r"></i>te dio</span>
      </div>
      <div class="flota" id="flota-propia"></div>
      <div class="seccion" style="margin-top:14px"><h2>📻 Bitácora</h2><span>últimos disparos</span></div>
      <ul id="bitacora"></ul>
      <button class="accion" id="b-otra" style="margin-top:14px" hidden>Otra batalla</button>
      </div>
    </div>
  </section>
</main>

<div id="final" hidden>
  <div class="tarjeta-final">
    <svg class="escena" viewBox="0 0 400 210" aria-hidden="true">
      <defs>
        <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1B1145"/><stop offset="100%" stop-color="#3A2A6B"/>
        </linearGradient>
        <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22306E"/><stop offset="100%" stop-color="#0D1236"/>
        </linearGradient>
        <radialGradient id="fogonazo">
          <stop offset="0%" stop-color="#FFE9A8"/><stop offset="45%" stop-color="#FF9B3C" stop-opacity=".75"/>
          <stop offset="100%" stop-color="#FF6B3C" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="400" height="210" fill="url(#cielo)"/>
      <circle cx="330" cy="42" r="19" fill="#F7F0D8" opacity=".9"/>
      <circle cx="322" cy="37" r="16" fill="#1B1145" opacity=".55"/>
      <g fill="#FFF" class="destello">
        <circle cx="40" cy="30" r="1.4"/><circle cx="95" cy="55" r="1"/><circle cx="150" cy="25" r="1.2"/>
        <circle cx="215" cy="48" r="1"/><circle cx="270" cy="22" r="1.3"/><circle cx="370" cy="80" r="1"/>
      </g>

      <!-- barco hundiéndose -->
      <g class="barco-hundido">
        <circle cx="150" cy="118" r="52" fill="url(#fogonazo)"/>
        <g transform="translate(150,132) rotate(-16)">
          <path d="M-52 0 h104 l-14 15 h-76 z" fill="#2A2036"/>
          <rect x="-34" y="-11" width="46" height="11" rx="2" fill="#3A2D4A"/>
          <rect x="-6" y="-25" width="11" height="15" fill="#453757"/>
          <rect x="-2" y="-38" width="2.5" height="14" fill="#453757"/>
          <g class="llama">
            <path d="M8 -12 q7 -13 13 -3 q5 -11 9 4 q3 12 -11 12 q-13 0 -11 -13z" fill="#FF8A3C"/>
            <path d="M13 -9 q4 -8 8 -1 q3 -6 5 3 q2 8 -7 8 q-8 0 -6 -10z" fill="#FFDD6B"/>
          </g>
        </g>
        <g fill="#5A4A70" opacity=".55">
          <circle cx="132" cy="86" r="12"/><circle cx="152" cy="72" r="9"/><circle cx="118" cy="97" r="8"/>
        </g>
      </g>

      <path class="ola" d="M-20 150 q30 -9 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v70 h-380z" fill="url(#mar)"/>
      <path class="ola2" d="M-20 168 q34 -8 68 0 t68 0 t68 0 t68 0 t68 0 v52 h-400z" fill="#0B0F2E" opacity=".85"/>
      <path class="ola" d="M-20 186 q30 -6 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v34 h-380z" fill="#070A22"/>
    </svg>
    <div class="cuerpo">
      <h2 id="final-t"></h2>
      <p class="sub" id="final-s"></p>
      <div class="cifras" id="final-c"></div>
      <button class="accion" id="b-revancha">⚓ Otra batalla</button>
      <button class="accion fantasma" id="b-cerrar">Ver el tablero</button>
    </div>
  </div>
</div>

<script type="module">
import { Lobby } from './lobby.js?v=4';
import { Sonido } from './sonido.js?v=4';

const sonido = new Sonido();

/* ── Flota clásica: 17 casillas ────────────────────────── */
const FLOTA = [
  {id:'portaaviones', n:'Portaaviones', l:5, c:'#7FA6FF',
   svg:'<svg viewBox="0 0 30 12"><path d="M1 6h28l-3 5H4z"/><rect x="3" y="3" width="24" height="3" rx="1"/><rect x="20" y="0" width="3" height="4"/></svg>'},
  {id:'acorazado',    n:'Acorazado',    l:4, c:'#FF9E5E',
   svg:'<svg viewBox="0 0 26 12"><path d="M1 6h24l-3 5H4z"/><rect x="6" y="3" width="4" height="3"/><rect x="15" y="3" width="4" height="3"/><rect x="11" y="0" width="2" height="6"/></svg>'},
  {id:'submarino',    n:'Submarino',    l:3, c:'#5FE0C0',
   svg:'<svg viewBox="0 0 22 12"><rect x="1" y="6" width="20" height="5" rx="2.5"/><path d="M8 2h5v4H8z"/><rect x="10" y="0" width="1.6" height="3"/></svg>'},
  {id:'crucero',      n:'Crucero',      l:3, c:'#C58CF0',
   svg:'<svg viewBox="0 0 22 12"><path d="M1 6h20l-3 5H4z"/><rect x="7" y="2" width="7" height="4"/><rect x="16" y="3" width="2.5" height="3"/></svg>'},
  {id:'destructor',   n:'Destructor',   l:2, c:'#F2D65C',
   svg:'<svg viewBox="0 0 16 12"><path d="M1 6h14l-3 5H4z"/><rect x="5" y="2" width="5" height="4"/><rect x="7" y="0" width="1.6" height="3"/></svg>'}
];
const barcoPorId = id => FLOTA.find(b => b.id === id);
const LETRAS = 'ABCDEFGHIJ';
const coord = i => LETRAS[Math.floor(i/10)] + (i%10 + 1);
const $ = id => document.getElementById(id);

let sala = null, miRol = null;
let misBarcos = {};
let sel = FLOTA[0].id, horizontal = true, resolviendo = false;

const estadoInicial = () => ({
  fase:'colocando', listos:{A:false,B:false}, turno:'A',
  pendiente:null, disparos:{}, hundidos:{}, ganador:'', marcador:{A:0,B:0}
});

/* ── Geometría ─────────────────────────────────────────── */
function celdasDesde(ancla, largo, horiz){
  const f = Math.floor(ancla/10), c = ancla%10;
  if (horiz && c + largo > 10) return null;
  if (!horiz && f + largo > 10) return null;
  return Array.from({length:largo}, (_,k) => horiz ? ancla + k : ancla + k*10);
}
function cabe(celdas, excepto){
  if (!celdas) return false;
  const oc = new Set();
  for (const [id, cs] of Object.entries(misBarcos)) if (id !== excepto) cs.forEach(c => oc.add(c));
  return celdas.every(c => !oc.has(c));
}
function flotaAlAzar(){
  const barcos = {}, ocupadas = new Set();
  for (const b of FLOTA){
    for (let t = 0; t < 800; t++){
      const cs = celdasDesde(Math.floor(Math.random()*100), b.l, Math.random() < .5);
      if (cs && cs.every(c => !ocupadas.has(c))){
        barcos[b.id] = cs; cs.forEach(c => ocupadas.add(c)); break;
      }
    }
  }
  return barcos;
}
function colocarAlAzar(){ misBarcos = flotaAlAzar(); }

/* ── Cuadrículas con coordenadas ───────────────────────── */
function construir(cont, alTocar, alPasar){
  cont.innerHTML = '';
  const esquina = document.createElement('div');
  esquina.className = 'eje';
  cont.appendChild(esquina);
  for (let c = 0; c < 10; c++){
    const e = document.createElement('div');
    e.className = 'eje'; e.textContent = c + 1;
    cont.appendChild(e);
  }
  const celdas = [];
  for (let f = 0; f < 10; f++){
    const e = document.createElement('div');
    e.className = 'eje'; e.textContent = LETRAS[f];
    cont.appendChild(e);
    for (let c = 0; c < 10; c++){
      const i = f*10 + c;
      const b = document.createElement('button');
      b.className = 'celda';
      b.setAttribute('aria-label', coord(i));
      b.innerHTML = '<span class="clavija" hidden></span>';
      if (alTocar){
        b.addEventListener('click', () => alTocar(i));
        // La vista previa al pasar el cursor solo existe en la colocación.
        // En el mar enemigo sería un disparo real con solo rozar la casilla.
        if (alPasar) b.addEventListener('pointerenter', ev => {
          if (ev.pointerType !== 'touch') alPasar(i);
        });
      } else b.disabled = true;
      cont.appendChild(b);
      celdas[i] = b;
    }
  }
  return celdas;
}

function marcar(cel, clases, clavija, color){
  cel.className = 'celda' + (clases ? ' ' + clases : '');
  cel.style.background = color || '';
  cel.style.borderColor = color ? 'rgba(255,255,255,.25)' : '';
  cel.firstElementChild.hidden = !clavija;
}

/** Mapa casilla → barco, para pintar cada nave de su color. */
function mapaBarcos(){
  const m = {};
  for (const [id, cs] of Object.entries(misBarcos)) cs.forEach(c => m[c] = id);
  return m;
}

/* ── Colocación ────────────────────────────────────────── */
function tocarColocacion(i, soloVista){
  const b = barcoPorId(sel);
  if (!b) return;
  const cs = celdasDesde(i, b.l, horizontal);
  if (soloVista){ pintarColocacion(cs); return; }
  if (!cabe(cs, sel)) return;
  misBarcos[sel] = cs;
  const falta = FLOTA.find(x => !misBarcos[x.id]);
  if (falta) sel = falta.id;
  pintarColocacion();
}

function pintarColocacion(previa){
  const mapa = mapaBarcos();
  const valida = previa && cabe(previa, sel);
  const colSel = barcoPorId(sel).c;
  celdasCol.forEach((cel,i) => {
    if (previa && previa.includes(i)){
      marcar(cel, valida ? 'previa' : 'mala', false, valida ? colSel + '99' : '');
    } else {
      const id = mapa[i];
      marcar(cel, id ? 'barco' : '', false, id ? barcoPorId(id).c : '');
    }
  });

  $('flota-chips').innerHTML = '';
  FLOTA.forEach(x => {
    const chip = document.createElement('button');
    chip.className = 'barco-chip' + (x.id === sel ? ' sel' : '') + (misBarcos[x.id] ? ' puesto' : '');
    chip.innerHTML = '<span class="silueta" style="color:' + x.c + '">' + x.svg + '</span>' +
                     '<span>' + x.n + '</span>' +
                     '<span class="casillas">' +
                     ('<i style="background:' + x.c + '"></i>').repeat(x.l) + '</span>' +
                     (misBarcos[x.id] ? '<span class="tic">✓</span>' : '');
    chip.addEventListener('click', () => {
      if (misBarcos[x.id]) delete misBarcos[x.id];
      sel = x.id; pintarColocacion();
    });
    $('flota-chips').appendChild(chip);
  });

  $('orientacion').textContent = horizontal ? '↔ Horizontal' : '↕ Vertical';
  const faltan = FLOTA.filter(x => !misBarcos[x.id]).length;
  $('b-listo').disabled = faltan > 0;
  banner(faltan > 0 ? 'Coloca tu flota' : 'Flota lista',
         faltan > 0 ? 'Te faltan ' + faltan + ' de ' + FLOTA.length + ' barcos'
                    : 'Pulsa zarpar cuando quieras empezar', '');
}

/* ── Disparos ──────────────────────────────────────────── */
async function disparar(i){
  const e = sala.ultimo && sala.ultimo.estado;
  if (!e || e.fase !== 'combate' || e.turno !== miRol || e.pendiente) return;
  if (((e.disparos && e.disparos[miRol]) || {})['c'+i]) return;
  await sala.actualizar(s => {
    const x = s.estado;
    if (x.fase !== 'combate' || x.turno !== miRol || x.pendiente) return false;
    x.pendiente = { de: miRol, celda: i };
  });
}

// El defensor resuelve el disparo que recibe: así el atacante nunca necesita
// —ni recibe— la posición de la flota enemiga.
async function resolver(p){
  if (resolviendo) return;
  resolviendo = true;
  try{
    const e = sala.ultimo.estado;
    const previos = (e.disparos && e.disparos[p.de]) || {};
    const celda = p.celda;
    let tocadoId = null;
    for (const [id, cs] of Object.entries(misBarcos)) if (cs.includes(celda)) tocadoId = id;

    let hundido = null;
    if (tocadoId){
      const cs = misBarcos[tocadoId];
      if (cs.every(c => c === celda || previos['c'+c] === 'tocado')) hundido = tocadoId;
    }

    await sala.actualizar(s => {
      const x = s.estado;
      if (!x.pendiente || x.pendiente.celda !== celda || x.pendiente.de !== p.de) return false;
      x.disparos = x.disparos || {};
      x.disparos[p.de] = x.disparos[p.de] || {};
      x.disparos[p.de]['c'+celda] = tocadoId ? 'tocado' : 'agua';
      if (hundido){
        x.hundidos = x.hundidos || {};
        x.hundidos[p.de] = x.hundidos[p.de] || {};
        x.hundidos[p.de][hundido] = true;
      }
      x.pendiente = null;
      x.ultimoTiro = { de:p.de, celda, res: tocadoId ? 'tocado' : 'agua', hundido: hundido || '', n:(x.n||0)+1 };
      x.n = (x.n || 0) + 1;
      x.log = ((x.log || []).concat([x.ultimoTiro])).slice(-8);
      if (hundido && Object.keys(x.hundidos[p.de]).length === FLOTA.length){
        x.fase = 'fin'; x.ganador = p.de;
        x.marcador = x.marcador || {A:0,B:0};
        x.marcador[p.de] = (x.marcador[p.de] || 0) + 1;
      } else {
        x.turno = p.de === 'A' ? 'B' : 'A';
      }
    });
  } finally { resolviendo = false; }
}

/* ── Pintado ───────────────────────────────────────────── */
let tiroVisto = 0, tempToast = null, turnoVisto = null;

function avisar(t, rival){
  const mio = t.de === miRol;
  const quien = sala.nombre(t.de);
  const barco = t.hundido ? barcoPorId(t.hundido).n : '';
  let titulo, sub;
  if (barco) titulo = (mio ? '💥 ¡Hundiste el ' : '💥 Te hundieron el ') + barco + '!';
  else if (t.res === 'tocado') titulo = mio ? '🎯 ¡Tocado!' : '💢 ¡Te dieron!';
  else titulo = mio ? '🌊 Agua' : '🌊 Falló';
  sub = quien + ' disparó a ' + coord(t.celda);

  $('toast-t').textContent = titulo;
  $('toast-s').textContent = sub;
  $('toast').className = 'ver ' + t.res;
  clearTimeout(tempToast);
  tempToast = setTimeout(() => { $('toast').className = ''; }, 4000);

  if (t.hundido) sonido.hundimiento();
  else if (t.res === 'tocado') sonido.explosion();
  else sonido.chapoteo();

  if (!mio && navigator.vibrate) navigator.vibrate(t.res === 'tocado' ? [90,60,90] : 40);
}

function pintarBitacora(log){
  const ul = $('bitacora');
  ul.innerHTML = '';
  (log || []).slice().reverse().forEach(t => {
    const li = document.createElement('li');
    li.className = t.de === miRol ? 'yo' : 'el';
    const quien = sala.nombre(t.de);
    const res = t.hundido ? '<span class="r">hundió el ' + barcoPorId(t.hundido).n + '</span>'
              : t.res === 'tocado' ? '<span class="r">tocado</span>' : 'agua';
    li.innerHTML = '<span>' + quien + ' → <b>' + coord(t.celda) + '</b></span><span>' + res + '</span>';
    ul.appendChild(li);
  });
  if (!ul.children.length) ul.innerHTML = '<li><span>Sin disparos todavía</span></li>';
}

function banner(titulo, sub, clase){
  $('banner-t').textContent = titulo;
  $('banner-s').innerHTML = sub || '';
  $('banner').className = clase || '';
}

function listaBarcos(cont, hundidos){
  cont.innerHTML = '';
  FLOTA.forEach(x => {
    const chip = document.createElement('span');
    chip.className = 'barco-chip' + (hundidos[x.id] ? ' roto' : '');
    const col = hundidos[x.id] ? 'var(--rojo)' : x.c;
    chip.innerHTML = '<span class="silueta" style="color:' + col + '">' + x.svg + '</span>' +
                     '<span>' + x.n + '</span>' +
                     '<span class="casillas">' +
                     ('<i style="background:' + col + '"></i>').repeat(x.l) + '</span>' +
                     (hundidos[x.id] ? '<span class="tic">💥</span>' : '');
    cont.appendChild(chip);
  });
}

async function editarNombre(){
  const actual = sala.nombre(miRol);
  const nuevo = prompt('¿Cómo te llamas?', actual === 'Jugador 1' || actual === 'Jugador 2' ? '' : actual);
  if (nuevo && nuevo.trim()) await sala.cambiarNombre(nuevo);
}

let finalMostrado = false;

function mostrarFinal(e, rival){
  const gane = e.ganador === miRol;
  const mios = (e.disparos && e.disparos[miRol]) || {};
  const tiros = Object.keys(mios).length;
  const dianas = Object.values(mios).filter(v => v === 'tocado').length;
  const punteria = tiros ? Math.round(dianas*100/tiros) : 0;

  $('final').className = gane ? 'gane' : 'perdio';
  $('final-t').textContent = gane ? '¡' + sala.nombre(miRol) + ' ha ganado!'
                                  : sala.nombre(e.ganador) + ' ha ganado';
  $('final-s').textContent = gane
    ? '¡Felicitaciones! Destruiste la flota completa de ' + sala.nombre(rival) + '.'
    : 'Tu flota fue hundida. La revancha se sirve fría.';
  $('final-c').innerHTML =
    '<div class="cifra"><b>' + tiros + '</b><span>Disparos</span></div>' +
    '<div class="cifra"><b>' + dianas + '</b><span>Impactos</span></div>' +
    '<div class="cifra"><b>' + punteria + '%</b><span>Puntería</span></div>';
  $('final').hidden = false;
  if (gane) sonido.victoria(); else sonido.derrota();
}

function pintar(s){
  if (!s || !s.estado){
    if (typeof mostrarFallo === 'function' && s && !s.estado)
      mostrarFallo('Sala creada con una versión anterior. Recarga (Ctrl+Shift+R) y crea otra.');
    return;
  }
  const e = s.estado, rival = miRol === 'A' ? 'B' : 'A';

  ['A','B'].forEach(r => {
    $('nom-'+r).textContent = sala.nombre(r);
    $('pt-'+r).textContent = (e.marcador && e.marcador[r]) || 0;
    $('tj-'+r).classList.toggle('activo', e.fase === 'combate' && e.turno === r);
    if (r === miRol){
      $('yo-'+r).innerHTML = '<button class="editar-nom">Tú · cambiar nombre ✏️</button>';
      $('yo-'+r).firstElementChild.addEventListener('click', editarNombre);
    } else {
      const on = sala.enLinea(r);
      $('yo-'+r).innerHTML = '<span class="punto-luz' + (on ? ' on' : '') + '"></span>' +
                             (on ? 'En línea' : 'Ausente');
    }
  });
  $('pt-tot').textContent = ((e.marcador && e.marcador.A) || 0) + ((e.marcador && e.marcador.B) || 0);

  $('zona-colocar').hidden = e.fase !== 'colocando';
  $('zona-combate').hidden = e.fase === 'colocando';

  if (e.fase === 'colocando'){
    if (e.listos && e.listos[miRol]){
      celdasCol.forEach(c => c.disabled = true);
      $('b-rotar').disabled = $('b-azar').disabled = $('b-listo').disabled = true;
      banner('Flota desplegada', sala.completa
        ? 'Esperando a que ' + sala.nombre(rival) + ' termine…'
        : 'Esperando a que entre tu rival…', '');
    }
    return;
  }

  const mios  = (e.disparos && e.disparos[miRol]) || {};
  const suyos = (e.disparos && e.disparos[rival]) || {};
  const hundíYo  = (e.hundidos && e.hundidos[miRol]) || {};
  const hundíEl  = (e.hundidos && e.hundidos[rival]) || {};
  const t = e.ultimoTiro;

  // Mar enemigo: solo mis clavijas
  const miTurno = e.fase === 'combate' && e.turno === miRol && !e.pendiente && sala.completa;
  $('malla-rival').classList.toggle('activo', miTurno);
  celdasRival.forEach((cel,i) => {
    const r = mios['c'+i];
    let cls = r === 'tocado' ? 'tocado' : r === 'agua' ? 'agua' : '';
    if (t && t.de === miRol && t.celda === i) cls += ' ultimo';
    marcar(cel, cls, !!r);
    cel.disabled = !miTurno || !!r;
  });

  // Mi mar: mis barcos y las clavijas del rival
  const mapa = mapaBarcos();
  celdasPropia.forEach((cel,i) => {
    const r = suyos['c'+i];
    const id = mapa[i];
    let cls = '';
    if (r === 'tocado') cls = 'tocado';
    else if (r === 'agua') cls = 'agua';
    if (t && t.de === rival && t.celda === i) cls += ' ultimo';
    // El barco conserva su color y la clavija se clava encima, como en el tablero real.
    const color = id ? (hundíEl[id] ? '#6E2430' : barcoPorId(id).c) : '';
    marcar(cel, cls, !!r, color);
  });

  listaBarcos($('flota-rival'), hundíYo);
  listaBarcos($('flota-propia'), hundíEl);
  $('restantes-rival').textContent  = (FLOTA.length - Object.keys(hundíYo).length) + ' a flote';
  $('restantes-propio').textContent = (FLOTA.length - Object.keys(hundíEl).length) + ' a flote';

  // Banner
  let eco = '';
  if (t){
    eco = sala.nombre(t.de) + ' disparó a ' + coord(t.celda) + ': ' + (t.res === 'tocado' ? '¡tocado!' : 'agua') +
          (t.hundido ? ' — ' + barcoPorId(t.hundido).n + ' hundido' : '');
  }

  if (e.fase === 'fin'){
    $('b-otra').hidden = false;
    if (!finalMostrado){ finalMostrado = true; setTimeout(() => mostrarFinal(e, rival), 600); }
    banner(e.ganador === miRol ? '🏆 ¡Ganaste!' : 'Perdiste esta',
           e.ganador === miRol ? 'Hundiste la flota de ' + sala.nombre(rival)
                               : sala.nombre(e.ganador) + ' hundió tu flota',
           e.ganador === miRol ? 'gane' : '');
  } else {
    $('b-otra').hidden = true;
    finalMostrado = false;
    $('final').hidden = true;
    if (!sala.completa) banner('Esperando rival', 'Comparte el código para empezar', '');
    else if (e.pendiente) banner(e.pendiente.de === miRol ? 'Disparo en camino…' : 'Te están disparando…', eco, '');
    else if (e.turno === miRol){
      banner('Tu turno', 'Toca una casilla del mar enemigo. ' + eco, 'mio');
      if (turnoVisto !== 'mio'){ turnoVisto = 'mio'; if (t) setTimeout(() => sonido.turno(), 700); }
    }
    else { banner('Turno de ' + sala.nombre(rival), eco, ''); turnoVisto = 'suyo'; }
  }

  pintarBitacora(e.log);
  if (t && t.n && t.n > tiroVisto){ tiroVisto = t.n; avisar(t, rival); }

  if (e.pendiente && e.pendiente.de !== miRol && Object.keys(misBarcos).length) resolver(e.pendiente);
}

/* ── Robot ─────────────────────────────────────────────────
   Caza y remate: busca en casillas alternas (ningún barco mide
   menos de dos, así que esa retícula no deja huecos) y al tocar
   algo persigue las casillas contiguas hasta hundirlo. */
function conectarRobot(sala, nivel){
  const R = 'B', HUM = 'A';
  const flota = flotaAlAzar();
  let cola = [], tocadas = [], ocupado = false, tiroVistoR = 0;

  const disparosR = () => (sala.ultimo.estado.disparos && sala.ultimo.estado.disparos[R]) || {};

  function vecinos(c){
    const f = Math.floor(c/10), col = c%10, v = [];
    if (f > 0) v.push(c-10);
    if (f < 9) v.push(c+10);
    if (col > 0) v.push(c-1);
    if (col < 9) v.push(c+1);
    return v;
  }

  /* Con dos o más impactos en el mismo barco ya se conoce su eje:
     no tiene sentido probar de lado, solo por los dos extremos. */
  function extremos(){
    if (tocadas.length < 2) return null;
    const filas = new Set(tocadas.map(c => Math.floor(c/10)));
    const cols  = new Set(tocadas.map(c => c%10));
    const ord = [...tocadas].sort((a,b) => a-b);
    const ini = ord[0], fin = ord[ord.length-1];
    if (filas.size === 1){
      const f = Math.floor(ini/10), lista = [];
      if (ini%10 > 0) lista.push(ini-1);
      if (fin%10 < 9) lista.push(fin+1);
      return lista.filter(c => Math.floor(c/10) === f);
    }
    if (cols.size === 1){
      const lista = [];
      if (ini >= 10) lista.push(ini-10);
      if (fin < 90)  lista.push(fin+10);
      return lista;
    }
    return null;
  }

  function elegir(){
    const hechos = disparosR();
    if (nivel >= 3){
      const ext = extremos();
      if (ext){
        const buenos = ext.filter(c => !hechos['c'+c]);
        if (buenos.length) return buenos[Math.floor(Math.random()*buenos.length)];
      }
    }
    if (nivel >= 2){
      while (cola.length){
        const c = cola.shift();
        if (!hechos['c'+c]) return c;
      }
    }
    const libres = [];
    for (let i = 0; i < 100; i++) if (!hechos['c'+i]) libres.push(i);
    if (!libres.length) return -1;
    // Solo el experto busca en retícula alterna: ningún barco mide
    // menos de dos casillas, así que esa malla no deja huecos.
    if (nivel >= 3){
      const alternas = libres.filter(i => ((i%10) + Math.floor(i/10)) % 2 === 0);
      if (alternas.length) return alternas[Math.floor(Math.random()*alternas.length)];
    }
    return libres[Math.floor(Math.random()*libres.length)];
  }

  function resolverRobot(p){
    const e = sala.ultimo.estado;
    const previos = (e.disparos && e.disparos[p.de]) || {};
    const celda = p.celda;
    let tocadoId = null;
    for (const [id, cs] of Object.entries(flota)) if (cs.includes(celda)) tocadoId = id;
    let hundido = null;
    if (tocadoId){
      const cs = flota[tocadoId];
      if (cs.every(c => c === celda || previos['c'+c] === 'tocado')) hundido = tocadoId;
    }
    sala.actualizar(s => {
      const x = s.estado;
      if (!x.pendiente || x.pendiente.celda !== celda || x.pendiente.de !== p.de) return false;
      x.disparos = x.disparos || {};
      x.disparos[p.de] = x.disparos[p.de] || {};
      x.disparos[p.de]['c'+celda] = tocadoId ? 'tocado' : 'agua';
      if (hundido){
        x.hundidos = x.hundidos || {};
        x.hundidos[p.de] = x.hundidos[p.de] || {};
        x.hundidos[p.de][hundido] = true;
      }
      x.pendiente = null;
      x.n = (x.n || 0) + 1;
      x.ultimoTiro = { de:p.de, celda, res: tocadoId ? 'tocado' : 'agua', hundido: hundido || '', n:x.n };
      x.log = ((x.log || []).concat([x.ultimoTiro])).slice(-8);
      if (hundido && Object.keys(x.hundidos[p.de]).length === FLOTA.length){
        x.fase = 'fin'; x.ganador = p.de;
        x.marcador = x.marcador || {A:0,B:0};
        x.marcador[p.de] = (x.marcador[p.de] || 0) + 1;
      } else x.turno = p.de === 'A' ? 'B' : 'A';
    });
  }

  const luego = (ms, fn) => { ocupado = true; setTimeout(() => { ocupado = false; fn(); }, ms); };

  sala.alCambiar(s => {
    const e = s.estado;
    if (!e || ocupado) return;

    // Aprende de su propio disparo anterior
    const t = e.ultimoTiro;
    if (t && t.de === R && t.n > tiroVistoR){
      tiroVistoR = t.n;
      if (t.res === 'tocado' && !t.hundido){ tocadas.push(t.celda); cola.push(...vecinos(t.celda)); }
      if (t.hundido){ cola = []; tocadas = []; }
    }

    if (e.fase === 'colocando'){
      if (!(e.listos && e.listos[R]))
        luego(800, () => sala.actualizar(x => {
          const y = x.estado;
          y.listos = y.listos || {};
          y.listos[R] = true;
          if (y.listos.A && y.listos.B) y.fase = 'combate';
        }));
      return;
    }
    if (e.fase !== 'combate') return;

    if (e.pendiente && e.pendiente.de === HUM){
      luego(500, () => resolverRobot(e.pendiente));
    } else if (!e.pendiente && e.turno === R){
      luego(900 + Math.random()*700, () => sala.actualizar(x => {
        const y = x.estado;
        if (y.pendiente || y.turno !== R || y.fase !== 'combate') return false;
        const c = elegir();
        if (c < 0) return false;
        y.pendiente = { de: R, celda: c };
      }));
    }
  });
}

/* ── Botones ───────────────────────────────────────────── */
$('b-cerrar').addEventListener('click', () => { $('final').hidden = true; });
$('b-revancha').addEventListener('click', () => { $('final').hidden = true; $('b-otra').click(); });

$('b-son').textContent = sonido.activo ? '🔊' : '🔇';
$('b-son').addEventListener('click', () => {
  $('b-son').textContent = sonido.alternar() ? '🔊' : '🔇';
});

$('b-rotar').addEventListener('click', () => { horizontal = !horizontal; pintarColocacion(); });
$('b-azar').addEventListener('click', () => { colocarAlAzar(); pintarColocacion(); });

$('b-listo').addEventListener('click', async () => {
  $('b-listo').disabled = true;
  await sala.guardarSecreto({ barcos: misBarcos });
  await sala.actualizar(s => {
    const e = s.estado;
    e.listos = e.listos || {};
    e.listos[miRol] = true;
    if (e.listos.A && e.listos.B) e.fase = 'combate';
  });
});

$('b-otra').addEventListener('click', async () => {
  misBarcos = {}; sel = FLOTA[0].id; tiroVisto = 0; turnoVisto = null; colocarAlAzar();
  await sala.actualizar(s => {
    const e = s.estado;
    if (e.fase !== 'fin') return false;
    e.fase = 'colocando'; e.listos = {A:false,B:false};
    e.disparos = {}; e.hundidos = {}; e.pendiente = null;
    e.ganador = ''; e.ultimoTiro = null; e.log = []; e.n = 0;
    e.turno = e.turno === 'A' ? 'B' : 'A';
  });
  celdasCol.forEach(c => c.disabled = false);
  $('b-rotar').disabled = $('b-azar').disabled = false;
  pintarColocacion();
});

/* ── Arranque ──────────────────────────────────────────── */
const celdasCol    = construir($('malla-propia-col'),
                                i => tocarColocacion(i),
                                i => tocarColocacion(i, true));
const celdasRival  = construir($('malla-rival'), disparar);
const celdasPropia = construir($('malla-propia'), null);

new Lobby({
  juego: 'batallanaval',
  titulo: 'Batalla <em>naval</em>',
  lema: 'Cada uno esconde su flota. Solo se revela lo que el otro acierta.',
  estadoInicial,
  nombreRobot: n => ['Grumete','Capitán','Almirante'][n-1],
  alSolo: async (s, nivel) => {
    sala = s; miRol = s.rol;
    colocarAlAzar(); pintarColocacion();
    s.alCambiar(pintar);
    conectarRobot(s, nivel);
  },
  alEntrar: async s => {
    sala = s; miRol = s.rol;
    colocarAlAzar();
    pintarColocacion();
    s.alCambiar(pintar);
    try{
      const guardado = await s.leerSecreto();
      if (guardado && guardado.barcos){
        misBarcos = guardado.barcos;
        pintarColocacion();
        if (s.ultimo) pintar(s.ultimo);
      }
    } catch(err){ console.warn('No se pudo recuperar la flota guardada', err); }
  }
});

/* En móvil, la pulsación larga sobre un control abre el menú del sistema
   y selecciona el texto del botón. Aquí no queremos ninguna de las dos. */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('button, canvas')) e.preventDefault();
});
</script>
