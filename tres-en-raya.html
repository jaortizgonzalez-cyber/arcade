<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tres en raya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  main{max-width:420px;margin:0 auto}
  [data-juego]{display:flex;flex-direction:column;gap:14px}

  #tablero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1}
  .casilla{background:var(--panel);border:2px solid var(--borde);border-radius:18px;
           display:grid;place-items:center;cursor:pointer;padding:14%;
           transition:background .15s,transform .1s}
  .casilla:hover:not(:disabled){background:#3B2757}
  .casilla:active:not(:disabled){transform:scale(.96)}
  .casilla:disabled{cursor:default}
  .casilla.gana{background:#3F2A5C;border-color:currentColor}
  .casilla svg{width:100%;height:100%;overflow:visible}
  .casilla svg *{fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round;
                 stroke-dasharray:var(--largo);stroke-dashoffset:var(--largo);
                 animation:trazo .28s ease-out forwards}
  .casilla svg line:last-child{animation-delay:.14s}
  @keyframes trazo{to{stroke-dashoffset:0}}
  .marca-X{color:var(--ambar)} .marca-O{color:var(--menta)}

  .tablero-caja{position:relative}
  #raya{position:absolute;inset:0;pointer-events:none;overflow:visible}
  #raya line{stroke-width:12;stroke-linecap:round;fill:none;
             stroke-dasharray:var(--largo);stroke-dashoffset:var(--largo);
             animation:trazar .45s .15s ease-out forwards;
             filter:drop-shadow(0 0 10px currentColor)}
  @keyframes trazar{to{stroke-dashoffset:0}}

  .fila-sup{display:flex;justify-content:flex-end;margin-bottom:-6px}
  #b-son{background:none;border:none;font-size:18px;padding:6px;cursor:pointer;opacity:.75}
  #b-son:hover{opacity:1}

  /* Pantalla de vencedor */
  #final{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;
         background:rgba(16,8,28,.85);backdrop-filter:blur(6px);animation:aparecer .35s ease-out}
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  .tarjeta-final{position:relative;width:100%;max-width:380px;background:var(--panel);
                 border:2px solid var(--borde);border-radius:24px;overflow:hidden;
                 box-shadow:0 24px 70px rgba(0,0,0,.6);text-align:center;
                 animation:subir .45s cubic-bezier(.2,1.3,.4,1)}
  @keyframes subir{from{transform:translateY(28px) scale(.92);opacity:0}to{transform:none;opacity:1}}
  .tarjeta-final .cuerpo{padding:20px}
  .rotulo{font-family:var(--display);font-weight:800;letter-spacing:.22em;font-size:11px;
          text-transform:uppercase;color:var(--ambar)}
  .perdio .rotulo{color:#9FB4E8} .empate .rotulo{color:var(--tenue)}
  .tarjeta-final h2{font-family:var(--display);font-weight:800;font-size:29px;
                    line-height:1.1;margin-top:4px}
  .gane h2{color:var(--ambar)} .perdio h2{color:#9FB4E8}
  .tarjeta-final .sub{font-size:14px;color:var(--tenue);margin-top:6px;line-height:1.5}
  .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
  .cifra{background:rgba(0,0,0,.25);border-radius:13px;padding:10px 4px}
  .cifra b{display:block;font-family:var(--display);font-weight:800;font-size:20px}
  .cifra span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
  .escena{display:block;width:100%;background:#191046}
  .brillo{transform-origin:190px 74px;animation:girar 26s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .flota-x{animation:latir 2s ease-in-out infinite}
  @keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .confeti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confeti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:1px;
             animation:caer linear infinite}
  @keyframes caer{0%{transform:translateY(0) rotate(0)}
                  100%{transform:translateY(320px) rotate(720deg);opacity:0}}

  #estado{text-align:center;font-size:15px;color:var(--tenue);min-height:24px}
  #estado strong{font-family:var(--display);font-weight:800;color:var(--tinta);font-size:18px}
</style>
</head>
<body>
<a class="inicio" href="index.html">◀ Sala de juegos</a>
<main>
  <div id="lobby"></div>

  <section data-juego hidden>
    <div class="marcador">
      <div class="jugador" data-rol="A" id="tj-A">
        <div class="nom" id="nom-A">—</div>
        <div class="puntos" id="pt-A">0</div>
        <div class="yo" id="yo-A">&nbsp;</div>
      </div>
      <div class="centro-info">Empates<b id="pt-E">0</b></div>
      <div class="jugador" data-rol="B" id="tj-B">
        <div class="nom" id="nom-B">—</div>
        <div class="puntos" id="pt-B">0</div>
        <div class="yo" id="yo-B">&nbsp;</div>
      </div>
    </div>
    <div class="fila-sup"><button id="b-son" aria-label="Activar o silenciar sonido">🔊</button></div>
    <div class="tablero-caja">
      <div id="tablero"></div>
      <svg id="raya" viewBox="0 0 100 100"><line id="raya-l" x1="0" y1="0" x2="0" y2="0"/></svg>
    </div>
    <p id="estado"></p>
    <button class="accion" id="b-nueva">Nueva partida</button>
  </section>
</main>

<div id="final" hidden>
  <div class="tarjeta-final">
    <svg class="escena" viewBox="0 0 380 150" aria-hidden="true">
      <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#241660"/><stop offset="100%" stop-color="#5B3A86"/>
        </linearGradient>
      </defs>
      <rect width="380" height="150" fill="url(#fondo)"/>
      <g class="brillo" opacity=".14" fill="#FFD98A">
        <path d="M190 74 L120 -30 L165 -34z"/><path d="M190 74 L215 -34 L255 -22z"/>
        <path d="M190 74 L300 4 L318 44z"/><path d="M190 74 L70 30 L78 -6z"/>
        <path d="M190 74 L320 96 L306 58z"/><path d="M190 74 L58 104 L66 68z"/>
      </g>
      <!-- tablero con la raya ganadora -->
      <g transform="translate(190,75)">
        <g stroke="#7B62B8" stroke-width="4" stroke-linecap="round">
          <line x1="-16" y1="-46" x2="-16" y2="46"/><line x1="16" y1="-46" x2="16" y2="46"/>
          <line x1="-46" y1="-16" x2="46" y2="-16"/><line x1="-46" y1="16" x2="46" y2="16"/>
        </g>
        <g class="flota-x" stroke="#FFC94A" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M-40 -40 L-24 -24 M-24 -40 L-40 -24"/>
          <path d="M-8 -8 L8 8 M8 -8 L-8 8"/>
          <path d="M24 24 L40 40 M40 24 L24 40"/>
        </g>
        <g stroke="#6FE7C4" stroke-width="6" fill="none" opacity=".8">
          <circle cx="32" cy="-32" r="9"/><circle cx="-32" cy="32" r="9"/>
        </g>
        <line x1="-48" y1="-48" x2="48" y2="48" stroke="#FF7B7B" stroke-width="7"
              stroke-linecap="round" opacity=".9"/>
      </g>
    </svg>
    <div class="confeti" id="confeti"></div>
    <div class="cuerpo">
      <div class="rotulo" id="final-r"></div>
      <h2 id="final-t"></h2>
      <p class="sub" id="final-s"></p>
      <div class="cifras" id="final-c"></div>
      <button class="accion" id="b-revancha">Otra partida</button>
      <button class="accion fantasma" id="b-cerrar" style="margin-top:8px">Ver el tablero</button>
    </div>
  </div>
</div>

<script type="module">
import { Lobby } from './lobby.js?v=4';
import { Sonido } from './sonido.js?v=4';

const sonido = new Sonido();

const SVG = {
  X:'<svg viewBox="0 0 100 100" style="--largo:100"><line x1="8" y1="8" x2="92" y2="92"/><line x1="92" y1="8" x2="8" y2="92"/></svg>',
  O:'<svg viewBox="0 0 100 100" style="--largo:245"><circle cx="50" cy="50" r="39"/></svg>'
};
const LINEAS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const VACIO = '---------';
const MARCA = { A:'X', B:'O' };
const $ = id => document.getElementById(id);

let sala = null, miRol = null, local = null, previo = null;
let vistaLinea = '', vistaGanador = '', finalMostrado = false;

const estadoInicial = () => ({
  tablero:VACIO, turno:'A', ganador:'', linea:'', inicia:'A', marcador:{A:0,B:0,E:0}
});

/* ── Reglas ────────────────────────────────────────────── */
function aplicarJugada(e, i, rol){
  if (e.ganador || e.turno !== rol || e.tablero[i] !== '-') return false;
  const t = e.tablero.split('');
  t[i] = rol;
  e.tablero = t.join('');
  e.marcador = e.marcador || {A:0,B:0,E:0};
  const linea = LINEAS.find(l => l.every(p => t[p] === rol));
  if (linea){
    e.ganador = rol; e.linea = linea.join('');
    e.marcador[rol] = (e.marcador[rol] || 0) + 1;
  } else if (!t.includes('-')){
    e.ganador = 'empate';
    e.marcador.E = (e.marcador.E || 0) + 1;
  } else {
    e.turno = rol === 'A' ? 'B' : 'A';
  }
  return true;
}

function reiniciar(e){
  const inicia = e.inicia === 'A' ? 'B' : 'A';
  Object.assign(e, { tablero:VACIO, turno:inicia, ganador:'', linea:'', inicia });
}

/* ── Tablero ───────────────────────────────────────────── */
const tablero = $('tablero');
for (let i = 0; i < 9; i++){
  const b = document.createElement('button');
  b.className = 'casilla';
  b.setAttribute('aria-label','Casilla ' + (i+1));
  b.addEventListener('click', () => jugar(i));
  tablero.appendChild(b);
}

async function jugar(i){
  sonido.turno();
  if (local){ if (aplicarJugada(local, i, local.turno)) pintar(local); return; }
  await sala.actualizar(s => s.estado ? aplicarJugada(s.estado, i, miRol) : false);
}

$('b-nueva').addEventListener('click', async () => {
  if (local){ reiniciar(local); pintar(local); return; }
  await sala.actualizar(s => { if (!s.estado.ganador) return false; reiniciar(s.estado); });
});

/* ── Raya ganadora ─────────────────────────────────────── */
function dibujarRaya(linea, ganador){
  const svg = $('raya'), l = $('raya-l');
  if (!linea){ svg.style.display = 'none'; return; }
  const idx = linea.split('').map(Number);
  const caja = tablero.getBoundingClientRect();
  // Si aún no hay maquetación (la sección acaba de mostrarse), reintentamos
  if (!caja.width){ requestAnimationFrame(() => dibujarRaya(linea, ganador)); return; }
  const centro = i => {
    const r = tablero.children[i].getBoundingClientRect();
    return [r.left + r.width/2 - caja.left, r.top + r.height/2 - caja.top];
  };
  const [x1, y1] = centro(idx[0]);
  const [x2, y2] = centro(idx[2]);
  // Alargamos un poco por fuera de los centros, como un trazo hecho a mano
  const dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy) || 1, ext = 0.16;
  svg.setAttribute('viewBox', `0 0 ${caja.width} ${caja.height}`);
  l.setAttribute('x1', x1 - dx*ext); l.setAttribute('y1', y1 - dy*ext);
  l.setAttribute('x2', x2 + dx*ext); l.setAttribute('y2', y2 + dy*ext);
  l.style.setProperty('--largo', n*(1 + 2*ext));
  const color = ganador === 'A' ? '#FFC94A' : '#6FE7C4';
  l.style.stroke = color;
  l.style.color = color;                    // para el resplandor del drop-shadow
  svg.style.display = 'block';
}
addEventListener('resize', () => { if (vistaLinea) dibujarRaya(vistaLinea, vistaGanador); });

/* ── Pantalla de vencedor ──────────────────────────────── */
function lanzarConfeti(){
  const cont = $('confeti');
  cont.innerHTML = '';
  const cols = ['#FFC94A','#6FE7C4','#FF7B7B','#C58CF0','#7FA6FF'];
  for (let i = 0; i < 36; i++){
    const c = document.createElement('i');
    c.style.left = Math.random()*100 + '%';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.5 + Math.random()*1.5) + 's';
    c.style.animationDelay = (Math.random()*1.6) + 's';
    cont.appendChild(c);
  }
}

function mostrarFinal(e){
  const empate = e.ganador === 'empate';
  const gane = !local && e.ganador === miRol;
  const m = e.marcador || {A:0,B:0,E:0};

  $('final').className = empate ? 'empate' : (local ? 'gane' : (gane ? 'gane' : 'perdio'));
  if (empate){
    $('final-r').textContent = 'Tablas';
    $('final-t').textContent = 'Nadie cede';
    $('final-s').textContent = 'Tablero lleno y sin tres en raya. Se juega otra.';
  } else if (local){
    $('final-r').textContent = '🏆 Vencedor';
    $('final-t').textContent = nombre(e.ganador) + ' gana';
    $('final-s').innerHTML = 'Tres en raya con <b>' + MARCA[e.ganador] + '</b>.';
  } else {
    $('final-r').textContent = gane ? '🏆 Vencedor' : 'Esta vez no';
    $('final-t').textContent = gane ? '¡Ganaste!' : nombre(e.ganador) + ' gana';
    $('final-s').innerHTML = gane
      ? 'Alineaste tres <b>' + MARCA[miRol] + '</b> y cerraste la partida.'
      : nombre(e.ganador) + ' alineó tres <b>' + MARCA[e.ganador] + '</b>. Te toca empezar la próxima.';
  }
  $('final-c').innerHTML =
    '<div class="cifra"><b>' + (m.A||0) + '</b><span>' + nombre('A') + '</span></div>' +
    '<div class="cifra"><b>' + (m.E||0) + '</b><span>Empates</span></div>' +
    '<div class="cifra"><b>' + (m.B||0) + '</b><span>' + nombre('B') + '</span></div>';

  $('final').hidden = false;
  if (empate){ $('confeti').innerHTML = ''; sonido.turno(); }
  else if (local || gane){ lanzarConfeti(); sonido.victoria(); }
  else { $('confeti').innerHTML = ''; sonido.derrota(); }
}

/* ── Pintado ───────────────────────────────────────────── */
function nombre(rol){
  if (local) return rol === 'A' ? 'Jugador 1' : 'Jugador 2';
  return sala.nombre(rol);
}

function pintar(e){
  if (!e){ $('estado').innerHTML = 'Sala incompatible: recarga con Ctrl+Shift+R y crea una nueva.'; return; }
  const linea = e.linea || '';
  [...tablero.children].forEach((b,i) => {
    const rol = e.tablero[i];
    if (!previo || previo[i] !== rol){
      b.className = 'casilla';
      b.innerHTML = rol === '-' ? '' : SVG[MARCA[rol]];
      if (rol !== '-') b.classList.add('marca-' + MARCA[rol]);
    }
    if (linea.includes(String(i))) b.classList.add('gana');
    const mio = local ? true : (e.turno === miRol && sala.completa);
    b.disabled = !!e.ganador || rol !== '-' || !mio;
  });
  previo = e.tablero;

  vistaLinea = e.linea || '';
  vistaGanador = e.ganador;
  dibujarRaya(vistaLinea, vistaGanador);

  if (e.ganador && !finalMostrado){
    finalMostrado = true;
    setTimeout(() => mostrarFinal(e), e.linea ? 750 : 350);
  }
  if (!e.ganador){ finalMostrado = false; $('final').hidden = true; }

  ['A','B'].forEach(r => {
    $('nom-'+r).textContent = nombre(r) + ' · ' + MARCA[r];
    $('pt-'+r).textContent = (e.marcador && e.marcador[r]) || 0;
    $('tj-'+r).classList.toggle('activo', !e.ganador && e.turno === r);
    if (local){ $('yo-'+r).innerHTML = '&nbsp;'; return; }
    const on = sala.enLinea(r);
    $('yo-'+r).innerHTML = '<span class="punto-luz' + (on ? ' on' : '') + '"></span>' +
                           (r === miRol ? 'Tú' : (on ? 'En línea' : 'Ausente'));
  });
  $('pt-E').textContent = (e.marcador && e.marcador.E) || 0;

  let msg;
  if (e.ganador === 'empate') msg = 'Empate, otra vez';
  else if (e.ganador) msg = '<strong>' + nombre(e.ganador) + '</strong> gana';
  else if (!local && !sala.completa) msg = 'Esperando a tu pareja…';
  else if (!local && e.turno === miRol) msg = 'Es <strong>tu turno</strong>';
  else msg = 'Turno de <strong>' + nombre(e.turno) + '</strong>';
  $('estado').innerHTML = msg;

  $('b-nueva').disabled = !local && !e.ganador;
}

$('b-son').textContent = sonido.activo ? '🔊' : '🔇';
$('b-son').addEventListener('click', () => {
  $('b-son').textContent = sonido.alternar() ? '🔊' : '🔇';
});
$('b-cerrar').addEventListener('click', () => { $('final').hidden = true; });
$('b-revancha').addEventListener('click', () => { $('final').hidden = true; $('b-nueva').click(); });

/* ── Robot ─────────────────────────────────────────────────
   Minimax completo: con juego perfecto el tres en raya siempre
   es empate, así que le dejamos un margen de error para que
   ganarle sea posible y la partida tenga gracia. */
function ganadorDe(t){
  for (const l of LINEAS){
    const v = t[l[0]];
    if (v !== '-' && v === t[l[1]] && v === t[l[2]]) return v;
  }
  return t.includes('-') ? null : 'empate';
}

function minimax(t, turno, robot, prof){
  const g = ganadorDe(t);
  if (g === robot)   return { punt: 10 - prof };
  if (g === 'empate') return { punt: 0 };
  if (g)             return { punt: prof - 10 };

  let mejor = null;
  for (let i = 0; i < 9; i++){
    if (t[i] !== '-') continue;
    const sig = t.slice(0,i) + turno + t.slice(i+1);
    const otro = turno === 'A' ? 'B' : 'A';
    const p = minimax(sig, otro, robot, prof+1).punt;
    if (!mejor || (turno === robot ? p > mejor.punt : p < mejor.punt)) mejor = { punt:p, i };
  }
  return mejor;
}

// Cuánto se despista según el nivel. En experto no falla nunca:
// con juego perfecto el tres en raya es empate, así que lo máximo
// a lo que se puede aspirar contra él es a las tablas.
const DESPISTE = { 1: 0.55, 2: 0.22, 3: 0 };

function jugadaRobot(t, robot, nivel){
  const libres = [];
  for (let i = 0; i < 9; i++) if (t[i] === '-') libres.push(i);
  if (!libres.length) return -1;
  if (Math.random() < DESPISTE[nivel]) return libres[Math.floor(Math.random()*libres.length)];
  const m = minimax(t, robot, robot, 0);
  return m && m.i != null ? m.i : libres[0];
}

function conectarRobot(sala, nivel){
  const ROBOT = 'B';
  let pensando = false;
  sala.alCambiar(s => {
    const e = s.estado;
    if (!e || e.ganador || e.turno !== ROBOT || pensando) return;
    pensando = true;
    const demora = 420 + Math.random()*420;      // que se note que "piensa"
    setTimeout(() => {
      pensando = false;
      const i = jugadaRobot(e.tablero, ROBOT, nivel);
      if (i >= 0) sala.actualizar(x => aplicarJugada(x.estado, i, ROBOT));
    }, demora);
  });
}

/* ── Arranque ──────────────────────────────────────────── */
// Al volver al catálogo liberamos el puesto: si no, la sala queda
// con un jugador fantasma hasta que Firebase note la desconexión.
document.querySelector('a.inicio').addEventListener('click', () => {
  try { if (sala && sala.salir) sala.salir(); } catch(e){}
});

new Lobby({
  juego: 'tresenraya',
  titulo: 'Tres en <em>raya</em>',
  estadoInicial,
  textoSolo: '🤖 Un jugador · contra el robot',
  tituloNivel: 'Nivel del <em>robot</em>',
  niveles: [
    { n:1, t:'Novato',  d:'Se despista a menudo. Se le puede ganar.' },
    { n:2, t:'Robot',   d:'Castiga los descuidos, pero falla a veces.' },
    { n:3, t:'Maestro', d:'Juego perfecto: lo máximo es empatarle.' }
  ],
  nombreRobot: n => ['Novato','Robot','Maestro'][n-1],
  alEntrar: s => {
    sala = s; miRol = s.rol; previo = null;
    s.alCambiar(x => pintar(x.estado));
    s.alJugador((r, q) => {
      $('estado').innerHTML = '<strong>' + s.nombre(r) + '</strong>' +
                              (q === 'entra' ? ' se unió' : ' salió');
    });
  },
  alSolo: (s, nivel) => {
    sala = s; miRol = s.rol; previo = null; finalMostrado = false;
    s.alCambiar(x => pintar(x.estado));
    conectarRobot(s, nivel);
  },
  alLocal: () => { local = estadoInicial(); previo = null; finalMostrado = false; pintar(local); }
});

/* En móvil, la pulsación larga sobre un control abre el menú del sistema
   y selecciona el texto del botón. Aquí no queremos ninguna de las dos. */

// Cancelar el táctil evita que iOS arrastre la selección de texto al pulsar.
document.querySelectorAll('button, canvas').forEach(el => {
  ['touchstart','touchmove','touchend'].forEach(ev =>
    el.addEventListener(ev, e => {
      // En los campos de texto sí queremos el comportamiento normal
      if (e.target.tagName === 'INPUT') return;
      e.preventDefault();
    }, { passive:false }));
});

document.addEventListener('contextmenu', e => {
  if (e.target.closest('button, canvas')) e.preventDefault();
});
</script>

<script>
// Si un módulo no carga (por ejemplo, un archivo que falta en el servidor),
// el navegador no ejecuta nada y la página queda en negro sin explicación.
// Esto lo convierte en un mensaje legible.
window.addEventListener('load', () => setTimeout(() => {
  const l = document.getElementById('lobby');
  if (l && l.children.length) return;
  const faltan = ['lobby.js','sala.js','sala-local.js','sonido.js','config.js','estilo.css'];
  Promise.all(faltan.map(f =>
    fetch(f, {cache:'no-store'}).then(r => r.ok ? null : f).catch(() => f)
  )).then(res => {
    const rotos = res.filter(Boolean);
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:999;display:grid;place-content:center;' +
      'gap:10px;padding:24px;text-align:center;background:#241634;color:#F3ECFF;' +
      'font-family:system-ui,sans-serif';
    d.innerHTML = '<h2 style="font-size:20px">El juego no pudo cargar</h2>' +
      (rotos.length
        ? '<p style="color:#FF7B7B;font-size:14px">Faltan estos archivos en el servidor:<br><b>' +
          rotos.join('<br>') + '</b></p><p style="font-size:13px;color:#A794C4">Súbelos al repositorio y recarga con Ctrl+Shift+R.</p>'
        : '<p style="font-size:14px;color:#A794C4">Los archivos están, pero el navegador guarda una versión vieja.<br>' +
          'Recarga forzando la caché: <b>Ctrl+Shift+R</b> en PC, o cierra la pestaña y vuelve a abrirla en el celular.</p>') +
      '<a href="index.html" style="color:#FFC94A;font-size:13px">◀ Volver a la sala de juegos</a>';
    document.body.appendChild(d);
  });
}, 2500));
</script>
</body>
</html>
