<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Motocross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  body{overflow-x:hidden}
  #fallo{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#5A1E28;
         color:#FFE3E3;font-size:12px;padding:10px 14px;font-family:ui-monospace,monospace;
         border-top:2px solid var(--rojo)}
  main{max-width:900px;margin:0 auto}
  [data-juego]{display:flex;flex-direction:column;gap:10px}

  /* Preparación */
  .opciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opcion{background:var(--panel);border:2px solid var(--borde);border-radius:14px;
          padding:12px 6px;text-align:center;cursor:pointer;color:var(--tinta);font:inherit}
  .opcion.sel{border-color:var(--ambar);background:#4A3A16}
  .opcion b{display:block;font-family:var(--display);font-weight:800;font-size:19px}
  .opcion span{font-size:10px;color:var(--tenue);letter-spacing:.08em;text-transform:uppercase}

  /* Pista */
  .lienzo-caja{position:relative;border-radius:16px;overflow:hidden;
               border:2px solid var(--borde);background:#0E1230}
  canvas{display:block;width:100%;aspect-ratio:16/9}

  /* HUD sobre la pista */
  .hud{position:absolute;inset:0;pointer-events:none;padding:10px;
       display:flex;flex-direction:column;justify-content:space-between}
  .hud-fila{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .placa{background:rgba(20,12,36,.72);border-radius:11px;padding:6px 10px;
         backdrop-filter:blur(3px);font-size:10px;letter-spacing:.1em;
         text-transform:uppercase;color:var(--tenue);text-align:center}
  .placa b{display:block;font-family:var(--display);font-weight:800;font-size:17px;
           color:var(--tinta);letter-spacing:0;line-height:1.15}
  .placa.pos b{color:var(--ambar)}
  #b-son{pointer-events:auto;background:rgba(20,12,36,.72);border:none;border-radius:11px;
         padding:8px 10px;font-size:16px;cursor:pointer;backdrop-filter:blur(3px)}

  #cuenta{position:absolute;inset:0;display:grid;place-items:center;
          font-family:var(--display);font-weight:800;font-size:clamp(50px,16vw,110px);
          color:var(--ambar);text-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none}
  #cuenta.oculto{display:none}

  /* Barra de progreso de la carrera */
  .progreso{position:relative;height:26px;background:var(--panel);border-radius:13px;
            border:2px solid var(--borde);margin-top:2px}
  .progreso .meta{position:absolute;right:6px;top:50%;transform:translateY(-50%);
                  font-size:11px;color:var(--tenue)}
  .ficha{position:absolute;top:50%;transform:translate(-50%,-50%);
         width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
         font-size:10px;font-weight:800;color:#241634;transition:left .12s linear}
  .ficha.A{background:var(--ambar)} .ficha.B{background:var(--menta)}

  /* Mandos */
  .mandos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mandos button{font-family:var(--display);font-weight:800;font-size:16px;
                 padding:22px 0;border-radius:16px;border:2px solid var(--borde);
                 background:var(--panel);color:var(--tinta);cursor:pointer;
                 touch-action:none;user-select:none}
  .mandos button:active,.mandos button.on{background:#4A3A16;border-color:var(--ambar)}
  .mandos .freno:active,.mandos .freno.on{background:#4A1E28;border-color:var(--rojo)}
  .pista-ayuda{font-size:11px;color:var(--tenue);text-align:center}

  /* Final */
  #final{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;
         background:rgba(16,8,28,.85);backdrop-filter:blur(6px);animation:aparecer .35s ease-out}
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  .tarjeta-final{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--borde);
                 border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);
                 animation:subir .45s cubic-bezier(.2,1.3,.4,1);text-align:center}
  @keyframes subir{from{transform:translateY(30px) scale(.92);opacity:0}to{transform:none;opacity:1}}
  .tarjeta-final .cuerpo{padding:20px}
  .tarjeta-final h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.1}
  .gane h2{color:var(--ambar)} .perdio h2{color:#9FB4E8}
  .tarjeta-final .sub{font-size:14px;color:var(--tenue);margin-top:6px;line-height:1.5}
  .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
  .cifra{background:rgba(0,0,0,.25);border-radius:13px;padding:10px 4px}
  .cifra b{display:block;font-family:var(--display);font-weight:800;font-size:19px}
  .cifra span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}

  .tarjeta-final{max-width:430px}
  .rotulo-campeon{font-family:var(--display);font-weight:800;letter-spacing:.22em;
                  font-size:12px;text-transform:uppercase;color:var(--ambar);margin-bottom:2px}
  .perdio .rotulo-campeon{color:#9FB4E8}
  .tarjeta-final h2{font-size:31px;margin-top:2px}

  /* Animaciones de la escena */
  .rayos{transform-origin:200px 62px;animation:girar 24s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .bandera{transform-origin:left center;animation:ondear-b 1.1s ease-in-out infinite alternate}
  .bandera.der{animation-delay:.4s}
  @keyframes ondear-b{from{transform:skewY(-5deg) scaleY(.97)}to{transform:skewY(6deg) scaleY(1.03)}}
  .campeon-moto{animation:brincar 1.6s ease-in-out infinite}
  @keyframes brincar{0%,100%{transform:translateY(0) rotate(-14deg)}
                     50%{transform:translateY(-5px) rotate(-20deg)}}
  .polvo{animation:polvear 1.8s ease-out infinite}
  @keyframes polvear{0%{opacity:.55;transform:translateX(0) scale(.7)}
                     100%{opacity:0;transform:translateX(-26px) scale(1.5)}}
  .trofeo{animation:destellar 2s ease-in-out infinite}
  @keyframes destellar{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}

  /* Confeti */
  .confeti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confeti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:1px;
             animation:caer linear infinite}
  @keyframes caer{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(340px) rotate(720deg);opacity:0}}
</style>
</head>

<div id="fallo" hidden></div>
<script type="module">
import { Lobby } from './lobby.js?v=3';

// Un error silencioso en un juego de canvas se ve como "no funciona".
// Mejor que se vea el motivo.
function mostrarFallo(msg){
  const d = document.getElementById('fallo');
  d.hidden = false;
  d.textContent = '⚠ ' + msg;
}
addEventListener('error', e => mostrarFallo(e.message + '  ·  ' + (e.filename||'').split('/').pop() + ':' + e.lineno));
addEventListener('unhandledrejection', e => mostrarFallo('Promesa: ' + (e.reason && e.reason.message || e.reason)));
import { Sonido } from './sonido.js?v=3';

const sonido = new Sonido();
const $ = id => document.getElementById(id);

const DISTANCIAS = [
  {m:1000, n:'Corta', t:'~1 min'},
  {m:2000, n:'Media', t:'~2 min'},
  {m:3000, n:'Larga', t:'~3 min'}
];

const estadoInicial = () => ({
  fase:'preparando', semilla: Math.floor(Math.random()*1e9), largo: 2000,
  listos:{A:false,B:false}, pos:{}, meta:{}, ganador:'', marcador:{A:0,B:0}
});

/* ── Generación de pista determinista ──────────────────────
   Ambos clientes calculan el mismo terreno a partir de la
   semilla guardada en la sala: no se transmite ni un byte. */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const PASO = 2;                       // resolución del terreno en metros
let pista = null;

function crearPista(semilla, largo){
  const r = mulberry32(semilla);
  const o1 = r()*99, o2 = r()*99, o3 = r()*99;
  const rampas = [];
  const cuantas = Math.floor(largo/110);
  for (let i = 0; i < cuantas; i++)
    {
      const w = 8 + r()*5;
      rampas.push({ x: 70 + r()*(largo-140), w, a: Math.min(3 + r()*4.5, w*0.52) });
    }

  const n = Math.ceil((largo + 120)/PASO);
  const h = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const x = i*PASO;
    let y = 3.2*Math.sin(x*0.018 + o1) + 1.9*Math.sin(x*0.052 + o2) + 0.8*Math.sin(x*0.115 + o3);
    for (const R of rampas){
      const d = (x - R.x)/R.w;
      if (Math.abs(d) < 2.4) y += R.a*Math.exp(-d*d*1.5);
    }
    if (x < 35) y *= x/35;                       // salida plana
    if (x > largo) y = y*0.3;                    // zona de frenado tras la meta
    h[i] = y;
  }
  return { h, largo, rampas };
}

function altura(x){
  if (!pista) return 0;
  const t = Math.max(0, Math.min(x, (pista.h.length-1)*PASO - 0.01))/PASO;
  const i = Math.floor(t), f = t - i;
  return pista.h[i]*(1-f) + pista.h[Math.min(i+1, pista.h.length-1)]*f;
}
const pendiente = x => (altura(x+0.6) - altura(x-0.6))/1.2;

/* ── Física de la moto ─────────────────────────────────── */
// G rige el vuelo; GCUESTA, la gravedad a lo largo del suelo. Se separan
// para garantizar que ninguna cuesta sea imposible de subir: con ACEL > GCUESTA
// la moto siempre puede trepar, aunque le cueste.
const G = 26, GCUESTA = 14, ACEL = 15.5, FRENO = 18, ROCE = 0.30, VMAX = 31, GIRO = 3.4;

function nuevaMoto(){
  return { x:6, y:altura(6), vx:0, vy:0, ang:0, va:0, suelo:true,
           caido:0, caidas:0, aire:0, mejorAire:0, terminado:false };
}

function pasoFisica(m, dt, gas, freno){
  if (m.caido > 0){
    m.caido -= dt;
    m.vx *= 0.90;
    m.x += m.vx*dt;
    m.y = altura(m.x);
    m.ang += (Math.atan(pendiente(m.x)) - m.ang)*0.12;
    if (m.caido <= 0){ m.va = 0; m.vy = 0; }
    return;
  }

  // Integración balística: si el terreno cae más rápido que la moto, vuela.
  m.vy -= G*dt;
  m.y  += m.vy*dt;
  m.x  += m.vx*dt;

  const suelo = altura(m.x);
  if (m.y <= suelo){
    const angSuelo = Math.atan(pendiente(m.x));
    if (!m.suelo){
      // Aterrizaje: si llega muy torcido, se cae.
      let d = m.ang - angSuelo;
      while (d >  Math.PI) d -= 2*Math.PI;
      while (d < -Math.PI) d += 2*Math.PI;
      if (Math.abs(d) > 1.05){
        m.caido = 1.4; m.caidas++; m.vx *= 0.25;
        sonido.explosion();
        sonido.patinar(false);
      } else {
        m.vx *= 0.94;
        if (m.aire > 0.8) sonido.turno();
      }
      m.mejorAire = Math.max(m.mejorAire, m.aire);
      m.aire = 0;
    }
    m.suelo = true;
    m.y = suelo;
    m.vy = pendiente(m.x)*m.vx;
    m.ang += (angSuelo - m.ang)*Math.min(1, 14*dt);

    if (m.caido <= 0){
      if (gas)   m.vx += ACEL*dt;
      if (freno) m.vx -= FRENO*dt;
      m.vx -= GCUESTA*Math.sin(angSuelo)*dt;            // gravedad a lo largo de la cuesta
      m.vx -= m.vx*ROCE*dt + Math.sign(m.vx)*0.6*dt;
      m.vx = Math.max(-4, Math.min(VMAX, m.vx));
    }
  } else {
    m.suelo = false;
    m.aire += dt;
    // En el aire los mismos botones inclinan la moto.
    if (gas)   m.va += GIRO*dt;
    if (freno) m.va -= GIRO*dt;
    m.va *= 0.985;
    m.ang += m.va*dt;
  }
}

/* ── Estado del juego ──────────────────────────────────── */
let sala = null, miRol = null, rival = null;
let moto = null, fantasma = null, objetivo = null;
let corriendo = false, t0 = 0, tiempo = 0, ultimoEnvio = 0, cuentaHasta = 0;
let finalMostrado = false, distanciaSel = 2000, esperaDesde = 0;
const teclas = {};

/* ── Dibujo ────────────────────────────────────────────── */
const cv = $('pista'), cx = cv.getContext('2d');
const W = 900, H = 506, VISTA = 62;               // metros visibles de ancho
const esc = W/VISTA;

function aPantalla(x, y, camX){
  return [ (x - camX)*esc + W*0.32, H*0.72 - y*esc ];
}

function rueda(x, y, r){
  cx.save();
  cx.translate(x, y);
  // Taches del neumático
  cx.strokeStyle = '#0F0B22'; cx.lineWidth = 3.2;
  for (let i = 0; i < 12; i++){
    const a = i*Math.PI/6;
    cx.beginPath();
    cx.moveTo(Math.cos(a)*(r-1.4), Math.sin(a)*(r-1.4));
    cx.lineTo(Math.cos(a)*(r+1.6), Math.sin(a)*(r+1.6));
    cx.stroke();
  }
  cx.beginPath(); cx.arc(0,0,r,0,7);
  cx.strokeStyle = '#181230'; cx.lineWidth = 3.6; cx.stroke();
  // Llanta y radios
  cx.beginPath(); cx.arc(0,0,r-3.4,0,7);
  cx.strokeStyle = '#B9B0CC'; cx.lineWidth = 1.3; cx.stroke();
  cx.strokeStyle = 'rgba(185,176,204,.7)'; cx.lineWidth = 0.8;
  for (let i = 0; i < 8; i++){
    const a = i*Math.PI/4;
    cx.beginPath(); cx.moveTo(0,0);
    cx.lineTo(Math.cos(a)*(r-3.4), Math.sin(a)*(r-3.4)); cx.stroke();
  }
  cx.beginPath(); cx.arc(0,0,2,0,7); cx.fillStyle = '#8E84A6'; cx.fill();
  cx.restore();
}

function dibujarMoto(m, camX, color, alfa, etiqueta){
  const [px, py] = aPantalla(m.x, m.y, camX);
  if (px < -160 || px > W + 160) return;
  cx.save();
  cx.globalAlpha = alfa;
  cx.translate(px, py);
  cx.rotate(-m.ang);
  if (m.caido > 0) cx.rotate(Math.PI*0.42);
  const e = esc*0.075;
  cx.scale(e, e);
  cx.lineJoin = 'round'; cx.lineCap = 'round';

  const RUE = 10;
  const XT = -17, XD = 18, YR = -RUE;      // ejes trasero y delantero

  // Basculante
  cx.strokeStyle = '#7A6E92'; cx.lineWidth = 3.2;
  cx.beginPath(); cx.moveTo(XT, YR); cx.lineTo(-3, YR-3); cx.stroke();
  // Amortiguador trasero
  cx.strokeStyle = '#D8CFE8'; cx.lineWidth = 2.4;
  cx.beginPath(); cx.moveTo(-6, YR-4); cx.lineTo(-2, YR-14); cx.stroke();
  // Horquilla delantera
  cx.strokeStyle = '#D8CFE8'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(XD, YR); cx.lineTo(11, YR-17); cx.stroke();

  // Chasis, tanque y asiento
  cx.fillStyle = color;
  cx.beginPath();
  cx.moveTo(-13, YR-8); cx.lineTo(-1, YR-13); cx.lineTo(9, YR-13);
  cx.lineTo(12, YR-8); cx.lineTo(0, YR-4); cx.closePath(); cx.fill();
  // Guardabarros trasero levantado
  cx.beginPath();
  cx.moveTo(-13, YR-9); cx.lineTo(-22, YR-12); cx.lineTo(-22, YR-9);
  cx.lineTo(-13, YR-6); cx.closePath(); cx.fill();
  // Guardabarros delantero
  cx.beginPath();
  cx.moveTo(13, YR-9); cx.lineTo(24, YR-6); cx.lineTo(24, YR-3);
  cx.lineTo(13, YR-6); cx.closePath(); cx.fill();
  // Placa portanúmero
  cx.fillStyle = '#F3ECFF';
  cx.beginPath(); cx.moveTo(11, YR-13); cx.lineTo(17, YR-17);
  cx.lineTo(19, YR-13); cx.lineTo(13, YR-10); cx.closePath(); cx.fill();
  // Escape
  cx.strokeStyle = '#9A8FB5'; cx.lineWidth = 2.6;
  cx.beginPath(); cx.moveTo(-2, YR-5); cx.lineTo(-14, YR-3); cx.stroke();
  // Manillar
  cx.strokeStyle = '#2A2140'; cx.lineWidth = 2.2;
  cx.beginPath(); cx.moveTo(11, YR-17); cx.lineTo(14, YR-21); cx.stroke();
  // Pedal
  cx.beginPath(); cx.moveTo(-2, YR-3); cx.lineTo(-6, YR-2); cx.stroke();

  // Piloto: rodillas dobladas, torso adelante, codo alto
  cx.strokeStyle = '#3E5FA8'; cx.lineWidth = 4.2;
  cx.beginPath(); cx.moveTo(-4, YR-11); cx.lineTo(-6, YR-19); cx.lineTo(2, YR-22); cx.stroke();  // pierna
  cx.strokeStyle = '#E85D4A'; cx.lineWidth = 5.2;
  cx.beginPath(); cx.moveTo(1, YR-21); cx.lineTo(7, YR-28); cx.stroke();                          // torso
  cx.strokeStyle = '#E85D4A'; cx.lineWidth = 3.4;
  cx.beginPath(); cx.moveTo(6, YR-27); cx.lineTo(9, YR-24); cx.lineTo(14, YR-21); cx.stroke();    // brazo al manillar
  // Casco con visera
  cx.fillStyle = '#F3ECFF';
  cx.beginPath(); cx.arc(9, YR-31, 4.6, 0, 7); cx.fill();
  cx.fillStyle = color;
  cx.beginPath(); cx.moveTo(12, YR-33); cx.lineTo(17, YR-34);
  cx.lineTo(16, YR-31); cx.lineTo(12, YR-31); cx.closePath(); cx.fill();
  cx.fillStyle = '#2A2140';
  cx.beginPath(); cx.arc(11, YR-30.5, 2, -0.6, 1.1); cx.fill();

  rueda(XT, YR, RUE);
  rueda(XD, YR, RUE);
  cx.restore();

  if (etiqueta){
    cx.globalAlpha = alfa;
    cx.fillStyle = color;
    cx.font = '700 15px "DM Sans", sans-serif';
    cx.textAlign = 'center';
    cx.fillText(etiqueta, px, py - esc*3.6);
    cx.globalAlpha = 1;
  }
}

/* Polvo levantado por la rueda trasera */
const polvo = [];
function soltarPolvo(m){
  if (!m.suelo || Math.abs(m.vx) < 6 || m.caido > 0) return;
  if (Math.random() > 0.55) return;
  polvo.push({ x: m.x - 1.2, y: m.y + 0.15, r: 0.25, v: 0.9 + Math.random()*0.7,
               dx: -0.6 - Math.random()*1.2, vida: 1 });
}
function pintarPolvo(dt, camX){
  for (let i = polvo.length - 1; i >= 0; i--){
    const p = polvo[i];
    p.vida -= dt*1.5; p.r += dt*2.2; p.x += p.dx*dt; p.y += p.v*dt*0.35;
    if (p.vida <= 0){ polvo.splice(i,1); continue; }
    const [px, py] = aPantalla(p.x, p.y, camX);
    cx.globalAlpha = p.vida*0.34;
    cx.fillStyle = '#C4A87E';
    cx.beginPath(); cx.arc(px, py, p.r*esc, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
}

let dtPolvo = 0.016;
function dibujar(){
  const camX = moto ? moto.x : 0;

  // Cielo
  const g = cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241A50'); g.addColorStop(1,'#5C3F7E');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);

  // Sol y montañas con parallax
  cx.fillStyle = 'rgba(255,217,138,.85)';
  cx.beginPath(); cx.arc(W*0.78, H*0.2, 26, 0, 7); cx.fill();
  for (const [f, col, alt] of [[0.15,'#332459',0.30],[0.35,'#3E2C66',0.22]]){
    cx.fillStyle = col; cx.beginPath(); cx.moveTo(0,H);
    for (let px = 0; px <= W; px += 12){
      const wx = (camX*f + px/esc);
      const y = H*0.62 - (Math.sin(wx*0.03)+Math.sin(wx*0.011)*1.6)*H*alt*0.22 - H*alt*0.25;
      cx.lineTo(px, y);
    }
    cx.lineTo(W,H); cx.closePath(); cx.fill();
  }

  // Terreno
  cx.beginPath();
  const x0 = camX - VISTA*0.35, x1 = camX + VISTA*0.75;
  for (let x = x0; x <= x1; x += 0.6){
    const [px, py] = aPantalla(x, altura(x), camX);
    x === x0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
  }
  const [pxf] = aPantalla(x1, 0, camX);
  cx.lineTo(pxf, H); cx.lineTo(aPantalla(x0,0,camX)[0], H); cx.closePath();
  const gt = cx.createLinearGradient(0, H*0.4, 0, H);
  gt.addColorStop(0,'#7A5C3A'); gt.addColorStop(0.06,'#5E4630'); gt.addColorStop(1,'#2B1F1A');
  cx.fillStyle = gt; cx.fill();
  cx.strokeStyle = '#9C7C4A'; cx.lineWidth = 3; cx.stroke();

  // Meta y salida
  for (const [mx, txt] of [[0,'SALIDA'], [pista.largo,'META']]){
    const [px, py] = aPantalla(mx, altura(mx), camX);
    if (px < -60 || px > W+60) continue;
    cx.fillStyle = 'rgba(243,236,255,.9)';
    cx.fillRect(px-2, py-esc*4.5, 4, esc*4.5);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++){
      cx.fillStyle = (r+c)%2 ? '#F3ECFF' : '#241634';
      cx.fillRect(px+2+c*9, py-esc*4.5+r*9, 9, 9);
    }
    cx.fillStyle = '#F3ECFF'; cx.font = '700 13px "DM Sans", sans-serif';
    cx.textAlign = 'left'; cx.fillText(txt, px+2, py-esc*4.5-8);
  }

  pintarPolvo(dtPolvo, camX);
  if (fantasma) dibujarMoto(fantasma, camX, '#6FE7C4', 0.62, sala ? sala.nombre(rival) : '');
  if (moto)     dibujarMoto(moto, camX, '#FFC94A', 1, null);
}

/* ── Bucle ─────────────────────────────────────────────── */
let ultimo = performance.now();
function bucle(ahora){
  requestAnimationFrame(bucle);
  try { cuadro(ahora); } catch(e){ mostrarFallo('bucle: ' + e.message); }
}

function cuadro(ahora){
  const dt = Math.min(0.05, (ahora - ultimo)/1000);
  ultimo = ahora;
  if (!pista || !moto) return;

  const e = sala && sala.ultimo ? sala.ultimo.estado : null;

  // Cuenta regresiva
  if (cuentaHasta){
    const falta = (cuentaHasta - Date.now())/1000;
    if (falta > 0){
      $('cuenta').classList.remove('oculto');
      $('cuenta').textContent = Math.ceil(falta);
    } else {
      $('cuenta').textContent = '¡YA!';
      setTimeout(() => $('cuenta').classList.add('oculto'), 600);
      cuentaHasta = 0; corriendo = true; t0 = performance.now();
      sonido.turno();
    }
  }

  const gas   = corriendo && !moto.terminado && (teclas.gas || false);
  const freno = corriendo && !moto.terminado && (teclas.freno || false);

  // Motor y derrape: el tono sigue la velocidad, y en el aire se embala
  if (corriendo){
    sonido.motorEstado(Math.abs(moto.vx)/VMAX, gas, moto.suelo);
    sonido.patinar(freno && moto.suelo && moto.vx > 3.5 && moto.caido <= 0);
  }
  if (corriendo && !moto.terminado){
    pasoFisica(moto, dt, gas, freno);
    tiempo = (performance.now() - t0)/1000;
    if (moto.x >= pista.largo){ moto.terminado = true; terminar(); }
  } else if (moto.terminado){
    pasoFisica(moto, dt, false, true);
    // Ya cruzó: frena hasta detenerse, pero no se devuelve por la cuesta
    if (moto.vx < 0){ moto.vx = 0; }
    if (moto.x < pista.largo){ moto.x = pista.largo; moto.y = altura(moto.x); }
  }

  // Interpolación suave del rival
  if (objetivo){
    if (!fantasma) fantasma = { ...objetivo, caido:0 };
    const k = Math.min(1, 9*dt);
    fantasma.x += (objetivo.x - fantasma.x)*k;
    fantasma.y += (objetivo.y - fantasma.y)*k;
    let d = objetivo.a - fantasma.ang;
    while (d >  Math.PI) d -= 2*Math.PI;
    while (d < -Math.PI) d += 2*Math.PI;
    fantasma.ang += d*k;
    fantasma.caido = objetivo.c ? 1 : 0;
  }

  // Envío de mi posición (10 veces por segundo)
  if (sala && corriendo && ahora - ultimoEnvio > 100){
    ultimoEnvio = ahora;
    sala.escribir('estado/pos/' + miRol, {
      x: +moto.x.toFixed(2), y: +moto.y.toFixed(2),
      a: +moto.ang.toFixed(3), v: +moto.vx.toFixed(1), c: moto.caido > 0 ? 1 : 0
    });
  }

  dtPolvo = dt;
  if (corriendo) soltarPolvo(moto);
  dibujar();
  if (miRol) hud(e);
}

function hud(e){
  $('hud-tiempo').textContent = tiempo.toFixed(1);
  $('hud-vel').textContent = Math.max(0, Math.round(moto.vx*3.6));
  const xr = objetivo ? objetivo.x : 0;
  $('hud-pos').textContent = !corriendo ? '—' : (moto.x >= xr ? '1º' : '2º');

  const p = m => Math.max(0, Math.min(1, m/pista.largo));
  $('fi-'+miRol).style.left = (6 + p(moto.x)*88) + '%';
  if (objetivo) $('fi-'+rival).style.left = (6 + p(xr)*88) + '%';

  const av = $('hud-aviso');
  if (moto.caido > 0){ av.hidden = false; av.innerHTML = '<b>¡Te caíste!</b>'; }
  else if (moto.terminado){
    av.hidden = false;
    av.innerHTML = '<b>¡Llegaste! ' + tiempo.toFixed(2) + 's</b>' +
                   (sala ? '<br>esperando a ' + sala.nombre(rival) : '');
  }
  else if (!moto.suelo && moto.aire > 0.5){ av.hidden = false; av.innerHTML = '<b>' + moto.aire.toFixed(1) + 's en el aire</b>'; }
  else av.hidden = true;
}

/* ── Carrera ───────────────────────────────────────────── */
async function terminar(){
  sonido.patinar(false);
  await sala.escribir('estado/meta/' + miRol, +tiempo.toFixed(2));
}

function arrancar(e){
  pista = crearPista(e.semilla, e.largo);
  moto = nuevaMoto();
  fantasma = null; objetivo = null;
  tiempo = 0; corriendo = false; finalMostrado = false; esperaDesde = 0;
  $('final').hidden = true;
  $('zona-prep').hidden = true;
  $('zona-carrera').hidden = false;
  cuentaHasta = Date.now() + 3300;
  sonido.motorEncender();
  sonido.motorEstado(0, false, true);
}

function lanzarConfeti(){
  const cont = $('confeti');
  cont.innerHTML = '';
  const cols = ['#FFC94A','#6FE7C4','#FF7B7B','#C58CF0','#7FA6FF','#F2D65C'];
  for (let i = 0; i < 42; i++){
    const c = document.createElement('i');
    c.style.left = Math.random()*100 + '%';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*1.8) + 's';
    c.style.width = (5 + Math.random()*5) + 'px';
    cont.appendChild(c);
  }
}

function mostrarFinal(e){
  sonido.motorApagar();
  sonido.patinar(false);
  const mio = e.meta[miRol], suyo = e.meta[rival];
  const gane = e.ganador === miRol;
  const dif = Math.abs(mio - suyo);
  const campeon = sala.nombre(e.ganador);
  const dist = (sala.ultimo.estado.largo || 2000);

  $('final').className = gane ? 'gane' : 'perdio';
  $('final-r').textContent = gane ? '🏆 Campeón de la jornada' : 'Segundo lugar';
  $('final-t').textContent = gane ? '¡' + campeon + ' es el campeón!'
                                  : campeon + ' cruzó primero';
  const abandono = dif > 900;
  $('final-s').innerHTML = abandono
    ? (gane ? sala.nombre(rival) + ' no llegó a la meta. Ganaste los ' + dist + ' metros.'
            : 'No cruzaste la meta a tiempo. ' + campeon + ' se lleva la jornada.')
    : gane
      ? 'Domaste los ' + dist + ' metros y le sacaste <b>' + dif.toFixed(2) +
        ' s</b> a ' + sala.nombre(rival) + '. La bandera a cuadros es tuya.'
      : 'Te ganó por <b>' + dif.toFixed(2) + ' s</b> en ' + dist +
        ' metros. Menos caídas la próxima y esto cambia.';
  $('final-c').innerHTML =
    '<div class="cifra"><b>' + mio.toFixed(2) + 's</b><span>Tu tiempo</span></div>' +
    '<div class="cifra"><b>' + moto.caidas + '</b><span>Caídas</span></div>' +
    '<div class="cifra"><b>' + moto.mejorAire.toFixed(1) + 's</b><span>Mejor salto</span></div>';

  $('final').hidden = false;
  if (gane){ lanzarConfeti(); sonido.victoria(); }
  else { $('confeti').innerHTML = ''; sonido.derrota(); }
}

/* ── Sincronización con la sala ────────────────────────── */
function pintar(s){
  if (!s || !s.estado) return;
  const e = s.estado;

  ['A','B'].forEach(r => {
    $('nom-'+r).textContent = sala.nombre(r);
    $('pt-'+r).textContent = (e.marcador && e.marcador[r]) || 0;
    $('tj-'+r).classList.toggle('activo', e.fase === 'corriendo');
    if (r === miRol) $('yo-'+r).textContent = 'TÚ';
    else {
      const on = sala.enLinea(r);
      $('yo-'+r).innerHTML = '<span class="punto-luz' + (on ? ' on' : '') + '"></span>' +
                             (on ? 'En línea' : 'Ausente');
    }
  });
  $('pt-tot').textContent = ((e.marcador && e.marcador.A)||0) + ((e.marcador && e.marcador.B)||0);
  $('fi-A').textContent = sala.nombre('A')[0].toUpperCase();
  $('fi-B').textContent = sala.nombre('B')[0].toUpperCase();

  // Posición del rival
  if (e.pos && e.pos[rival]) objetivo = e.pos[rival];

  if (e.fase === 'preparando'){
    $('zona-prep').hidden = false;
    $('zona-carrera').hidden = true;
    distanciaSel = e.largo;
    pintarDistancias(e);
    const yo = e.listos && e.listos[miRol];
    $('b-listo').textContent = yo ? '✓ Listo — esperando…' : 'Estoy listo';
    $('b-listo').disabled = !!yo || !sala.completa;
    $('txt-prep').textContent = !sala.completa
      ? 'Esperando a que entre tu rival…'
      : (miRol === 'A' ? 'Elige la distancia y confirma. Los dos deben estar listos.'
                       : 'La distancia la elige ' + sala.nombre('A') + '. Confirma cuando quieras.');
  }

  if (e.fase === 'corriendo' && $('zona-carrera').hidden) arrancar(e);

  // Cuando ambos llegan, A decide el resultado
  // Si yo llegué y el rival no, tras 15 s ofrezco cerrar la carrera
  const yoLlegue = e.meta && e.meta[miRol] != null;
  const elLlego  = e.meta && e.meta[rival] != null;
  $('b-abandono').hidden = !(yoLlegue && !elLlego && (Date.now() - esperaDesde) > 15000);
  if (yoLlegue && !elLlego && !esperaDesde) esperaDesde = Date.now();
  if (!yoLlegue) esperaDesde = 0;

  const mA = e.meta && e.meta.A, mB = e.meta && e.meta.B;
  if (mA != null && mB != null && !e.ganador && miRol === 'A'){
    sala.actualizar(x => {
      const y = x.estado;
      if (y.ganador) return false;
      const g = y.meta.A <= y.meta.B ? 'A' : 'B';
      y.ganador = g; y.fase = 'fin';
      y.marcador = y.marcador || {A:0,B:0};
      y.marcador[g] = (y.marcador[g] || 0) + 1;
    });
  }
  if (e.fase === 'fin' && !finalMostrado && e.meta && e.meta.A != null && e.meta.B != null){
    finalMostrado = true;
    corriendo = false;
    setTimeout(() => mostrarFinal(e), 500);
  }
}

function pintarDistancias(e){
  const cont = $('distancias');
  cont.innerHTML = '';
  DISTANCIAS.forEach(d => {
    const b = document.createElement('button');
    b.className = 'opcion' + (e.largo === d.m ? ' sel' : '');
    b.innerHTML = '<b>' + d.m + ' m</b><span>' + d.n + ' · ' + d.t + '</span>';
    b.disabled = miRol !== 'A';
    b.addEventListener('click', () => sala.actualizar(s => {
      if (s.estado.fase !== 'preparando') return false;
      s.estado.largo = d.m;
    }));
    cont.appendChild(b);
  });
}

/* ── Mandos ────────────────────────────────────────────── */
function mando(id, prop){
  const b = $(id);
  const on  = ev => { ev.preventDefault(); teclas[prop] = true;  b.classList.add('on'); };
  const off = ev => { teclas[prop] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, off));
}
$('b-son').textContent = sonido.activo ? '🔊' : '🔇';
$('b-son').addEventListener('click', () => {
  $('b-son').textContent = sonido.alternar() ? '🔊' : '🔇';
});

mando('b-gas','gas');
mando('b-freno','freno');
const TECLA_GAS   = ['ArrowRight','ArrowUp','d','D','w','W',' '];
const TECLA_FRENO = ['ArrowLeft','ArrowDown','a','A','s','S'];
function tecla(e, valor){
  if (TECLA_GAS.includes(e.key)){ e.preventDefault(); teclas.gas = valor; pintarMandos(); }
  if (TECLA_FRENO.includes(e.key)){ e.preventDefault(); teclas.freno = valor; pintarMandos(); }
}
addEventListener('keydown', e => tecla(e, true));
addEventListener('keyup',   e => tecla(e, false));
addEventListener('blur', () => { teclas.gas = teclas.freno = false; pintarMandos(); });

function pintarMandos(){
  $('b-gas').classList.toggle('on', !!teclas.gas);
  $('b-freno').classList.toggle('on', !!teclas.freno);
}

// En PC la mitad derecha del lienzo acelera y la izquierda frena, sin soltar.
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  cv.setPointerCapture(ev.pointerId);
  const r = cv.getBoundingClientRect();
  const derecha = (ev.clientX - r.left) > r.width/2;
  teclas[derecha ? 'gas' : 'freno'] = true;
  pintarMandos();
});
['pointerup','pointercancel'].forEach(ev =>
  cv.addEventListener(ev, () => { teclas.gas = teclas.freno = false; pintarMandos(); }));

$('b-listo').addEventListener('click', () => sala.actualizar(s => {
  const e = s.estado;
  if (e.fase !== 'preparando') return false;
  e.listos = e.listos || {};
  e.listos[miRol] = true;
  if (e.listos.A && e.listos.B){ e.fase = 'corriendo'; e.pos = {}; e.meta = {}; }
}));

$('b-abandono').addEventListener('click', () => sala.actualizar(s => {
  const e = s.estado;
  if (e.ganador || !e.meta || e.meta[miRol] == null) return false;
  e.meta[rival] = e.meta[miRol] + 999;      // no llegó: pierde por abandono
  e.ganador = miRol; e.fase = 'fin';
  e.marcador = e.marcador || {A:0,B:0};
  e.marcador[miRol] = (e.marcador[miRol] || 0) + 1;
}));

$('b-cerrar').addEventListener('click', () => { $('final').hidden = true; });
$('b-revancha').addEventListener('click', () => {
  $('final').hidden = true;
  sala.actualizar(s => {
    const e = s.estado;
    if (e.fase !== 'fin') return false;
    e.fase = 'preparando'; e.listos = {A:false,B:false};
    e.pos = {}; e.meta = {}; e.ganador = '';
    e.semilla = Math.floor(Math.random()*1e9);
  });
});

/* ── Arranque ──────────────────────────────────────────── */
pista = crearPista(1, 800);
moto = nuevaMoto();
requestAnimationFrame(bucle);

new Lobby({
  juego: 'motocross',
  titulo: 'Moto<em>cross</em>',
  lema: 'Misma pista, dos motos, un cronómetro.',
  estadoInicial,
  alEntrar: s => {
    sala = s; miRol = s.rol; rival = s.rival;
    s.alCambiar(pintar);
  }
});
</script>
