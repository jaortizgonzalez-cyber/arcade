<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Furia Callejera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  body{overflow-x:hidden}
  #fallo{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#5A1E28;
         color:#FFE3E3;font-size:12px;padding:10px 14px;font-family:ui-monospace,monospace;
         border-top:2px solid var(--rojo)}
  main{max-width:900px;margin:0 auto}
  [data-juego]{display:flex;flex-direction:column;gap:8px}

  .banda{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .peleador{background:var(--panel);border:2px solid var(--borde);border-radius:12px;
            padding:6px 9px;min-width:118px}
  .peleador.yo{border-color:currentColor}
  .peleador.fuera{opacity:.4}
  .peleador .fila{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .peleador .nm{font-weight:700;font-size:12px;color:var(--tinta);max-width:74px;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .peleador .vd{font-size:10px;letter-spacing:1px;color:currentColor}
  .barra{height:7px;background:#160E2C;border-radius:4px;overflow:hidden;margin-top:4px}
  .barra i{display:block;height:100%;background:currentColor;border-radius:4px;transition:width .18s}
  .zonaHud{align-self:center;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
           color:var(--tenue);text-align:center}
  .zonaHud b{display:block;font-family:var(--display);font-size:17px;color:var(--tinta);letter-spacing:0}

  .escenario{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--borde)}
  canvas{display:block;width:100%;aspect-ratio:16/9;background:#0E0A1E}
  #aviso{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;
         font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,36px);
         color:var(--ambar);text-shadow:0 4px 18px rgba(0,0,0,.85);opacity:0;transition:opacity .25s}
  #aviso.ver{opacity:1}
  #b-son{position:absolute;right:8px;top:8px;background:rgba(20,12,36,.7);border:none;
         border-radius:10px;padding:7px 9px;font-size:15px;cursor:pointer}
  #capa{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:8px;
        padding:20px;background:rgba(14,10,30,.9)}
  #capa.oculta{display:none}
  #capa h2{font-family:var(--display);font-weight:800;font-size:clamp(21px,5vw,30px)}
  #capa p{font-size:13px;color:var(--tenue);max-width:320px;line-height:1.5}
  #capa button{margin-top:6px;font-family:inherit;font-weight:700;font-size:15px;
               padding:12px 26px;border-radius:13px;border:none;background:var(--ambar);
               color:#241634;cursor:pointer}

  .mandos{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
  .cruz{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:156px}
  .cruz button{aspect-ratio:1;border-radius:12px;border:2px solid var(--borde);
               background:var(--panel);color:var(--tinta);font-size:17px;cursor:pointer}
  .cruz .hueco{visibility:hidden;border:none;background:none}
  .acciones2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .acciones2 button{padding:18px 0;border-radius:13px;border:2px solid var(--borde);
                    background:var(--panel);color:var(--tinta);cursor:pointer;
                    font-family:var(--display);font-weight:800;font-size:14px}
  .acciones2 .pu{color:#FFC94A} .acciones2 .pa{color:#6FE7C4}
  .acciones2 .sa{color:#C58CF0;grid-column:span 2;padding:14px 0}
  button.on{background:#3F2A5C}
  .ayuda{font-size:11px;color:var(--tenue);text-align:center;line-height:1.5}
</style>
</head>
<body>
<a class="inicio" href="index.html">◀ Sala de juegos</a>
<main>
  <div id="lobby"></div>

  <section data-juego hidden>
    <div class="banda" id="banda"></div>
    <div class="zonaHud">Zona<b id="hud-zona">1</b></div>

    <div class="escenario">
      <canvas id="lienzo" width="960" height="540"></canvas>
      <div id="aviso"></div>
      <button id="b-son" aria-label="Silenciar">🔊</button>
      <div id="capa" class="oculta">
        <h2 id="capa-t"></h2>
        <p id="capa-s"></p>
        <button id="capa-b">Empezar</button>
      </div>
    </div>

    <div class="mandos">
      <div class="cruz">
        <button class="hueco"></button><button data-m="arriba">▲</button><button class="hueco"></button>
        <button data-m="izq">◀</button><button class="hueco"></button><button data-m="der">▶</button>
        <button class="hueco"></button><button data-m="abajo">▼</button><button class="hueco"></button>
      </div>
      <div class="acciones2">
        <button class="pu" data-m="puno">PUÑO</button>
        <button class="pa" data-m="patada">PATADA</button>
        <button class="sa" data-m="salto">SALTO</button>
      </div>
    </div>
    <p class="ayuda">Teclado: W A S D para moverte · F puño · G patada · H salto</p>
  </section>
</main>

<div id="fallo" hidden></div>
<script type="module">
import { Lobby } from './lobby.js?v=4';

function mostrarFallo(msg){
  const d = document.getElementById('fallo');
  d.hidden = false; d.textContent = '⚠ ' + msg;
}
addEventListener('error', e => mostrarFallo(e.message + ' · ' + (e.filename||'').split('/').pop() + ':' + e.lineno));
addEventListener('unhandledrejection', e => mostrarFallo('Promesa: ' + (e.reason && e.reason.message || e.reason)));
import { Sonido } from './sonido.js?v=4';

const sonido = new Sonido();
const $ = id => document.getElementById(id);

/* ── Mundo ─────────────────────────────────────────────────
   x avanza por la calle, y es la profundidad (arriba = lejos),
   z la altura del salto. La planta clásica del género. */
const W = 960, H = 540;
const HONDO0 = 0, HONDO1 = 100;
const ZONAS = 3, MAX_J = 4;

const COL_J = { A:'#6FA8FF', B:'#FF7B7B', C:'#7BE8A0', D:'#E8C25C' };
const cv = $('lienzo'), cx = cv.getContext('2d');

const NIVEL = {
  1:{ dano:0.7, cuantos:0, nombre:'Pandilla floja' },
  2:{ dano:1.0, cuantos:0, nombre:'Pandilla' },
  3:{ dano:1.18, cuantos:1, nombre:'Pandilla brava' }
};
let nivel = 2;

const TIPOS = {
  maton: { vida:34, vel:1.5, dano:4,  alcance:34, col:'#8E5FBF', pelo:'#E85D8A', ancho:1 },
  bruto: { vida:70, vel:1.1, dano:6,  alcance:38, col:'#B5713A', pelo:'#3A2A22', ancho:1.28 },
  jefe:  { vida:150, vel:1.4, dano:8, alcance:42, col:'#C43B63', pelo:'#1B1233', ancho:1.12 }
};
const ATACANTES = 2;

const estadoInicial = () => ({
  fase:'listos', zona:0, ganador:'',
  pos:{}, salud:{}, vidas:{}, golpes:{}, enemigos:[]
});

/* ── Entidades ─────────────────────────────────────────── */
function nuevoLuchador(x, y){
  return { x, y, z:0, vz:0, dir:1, est:'quieto', marco:0, ataque:0,
           salud:100, invul:0, aturdido:0, enSuelo:0, tipo:'jugador' };
}
let contadorId = 1;
function nuevoEnemigo(tipo, x, y){
  const d = TIPOS[tipo];
  return { i:contadorId++, t:tipo, x, y, z:0, dir:-1, v:d.vida, vmax:d.vida,
           est:'quieto', marco:0, ataque:0, espera:0, invul:0, aturdido:0, enSuelo:0 };
}

/* ── Estado local ──────────────────────────────────────── */
let sala = null, miRol = 'A', anfitrion = true, soloLocal = false;
let mios = {}, enemigos = [], camX = 0, oleada = 0, zona = 0;
let corriendo = false, ultimoEnvio = 0, sacudida = 0, chispas = [];
let avisoHasta = 0, finalMostrado = false, nGolpe = 0, vistos = {};
const pulsa = {};

const roles = () => soloLocal ? ['A'] : (sala && sala.ocupados ? sala.ocupados() : ['A']);

/* ── Controles ─────────────────────────────────────────── */
const TECLAS = { a:'izq', d:'der', w:'arriba', s:'abajo',
                 arrowleft:'izq', arrowright:'der', arrowup:'arriba', arrowdown:'abajo',
                 f:'puno', g:'patada', h:'salto', ' ':'salto', j:'puno', k:'patada' };
addEventListener('keydown', e => { const m = TECLAS[e.key.toLowerCase()];
  if (m){ e.preventDefault(); pulsa[m] = true; } });
addEventListener('keyup', e => { const m = TECLAS[e.key.toLowerCase()];
  if (m){ e.preventDefault(); pulsa[m] = false; } });
addEventListener('blur', () => { for (const k in pulsa) pulsa[k] = false; });

function blindarTacto(el){
  if (!el) return;
  ['touchstart','touchmove','touchend','touchcancel'].forEach(ev =>
    el.addEventListener(ev, e => e.preventDefault(), { passive:false }));
}
document.querySelectorAll('[data-m]').forEach(b => {
  const m = b.dataset.m;
  const on  = e => { e.preventDefault(); b.setPointerCapture(e.pointerId);
                     pulsa[m] = true; b.classList.add('on'); };
  const off = () => { pulsa[m] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup','pointercancel'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('lostpointercapture', off);
  blindarTacto(b);
});
blindarTacto(cv);
document.addEventListener('contextmenu', e => {
  if (e.target.closest('button, canvas')) e.preventDefault();
});
$('b-son').textContent = sonido.activo ? '🔊' : '🔇';
$('b-son').addEventListener('click', () => { $('b-son').textContent = sonido.alternar() ? '🔊' : '🔇'; });

/* ── Oleadas ───────────────────────────────────────────── */
function generarOleada(z, n){
  const lista = [];
  const jug = roles().length;
  const cuantos = 2 + z + Math.min(2, n) + NIVEL[nivel].cuantos + (jug > 2 ? 1 : 0);
  for (let k = 0; k < cuantos; k++){
    const tipo = (z === ZONAS-1 && k === 0) ? 'jefe'
               : (Math.random() < 0.28 + z*0.1 ? 'bruto' : 'maton');
    const lado = Math.random() < 0.5 ? -1 : 1;
    lista.push(nuevoEnemigo(tipo, camX + lado*(W*0.55 + Math.random()*160),
                            HONDO0 + Math.random()*(HONDO1 - HONDO0)));
  }
  return lista;
}

/* ── Combate ───────────────────────────────────────────── */
function chispear(x, y, z){ chispas.push({ x, y, z, v:12 }); }

/** Un golpe de jugador contra los enemigos. Solo lo resuelve el anfitrión. */
function golpeAEnemigos(g){
  const alcance = g.t === 'patada' ? 46 : 36;
  const dano = g.t === 'patada' ? 14 : 9;
  const bx = g.x + g.d*alcance*0.6;
  let acerto = false;
  for (const o of enemigos){
    if (o.v <= 0 || o.invul > 0) continue;
    if (Math.abs(o.x - bx) > alcance) continue;
    if (Math.abs(o.y - g.y) > 22) continue;
    if (Math.abs(o.z - g.z) > 34) continue;
    acerto = true;
    o.invul = 12; o.dir = o.x < g.x ? 1 : -1;
    o.v -= dano; o.est = 'herido'; o.aturdido = 16; o.x += g.d*10;
    if (o.v <= 0){ o.est = 'suelo'; o.enSuelo = 70; }
    chispear(bx, o.y, o.z + 22);
  }
  return acerto;
}

/** Un golpe de enemigo contra los jugadores. Solo lo resuelve el anfitrión. */
function golpeAJugadores(e){
  const d = TIPOS[e.t];
  const bx = e.x + e.dir*d.alcance*0.6;
  for (const r of roles()){
    const o = mios[r];
    if (!o || o.salud <= 0 || o.invul > 0) continue;
    if (Math.abs(o.x - bx) > d.alcance) continue;
    if (Math.abs(o.y - e.y) > 22) continue;
    if (Math.abs(o.z - e.z) > 34) continue;
    o.salud -= d.dano * NIVEL[nivel].dano;
    o.est = 'herido'; o.aturdido = 12; o.invul = 55;
    o.x += e.dir*8;
    chispear(bx, o.y, o.z + 22);
    sacudida = Math.max(sacudida, 5);
    if (o.salud <= 0){ o.salud = 0; o.est = 'suelo'; o.enSuelo = 90; sonido.caida(); }
    if (!soloLocal) sala.escribir('estado/salud/' + r, Math.max(0, Math.round(o.salud)));
  }
}

/* ── Movimiento ────────────────────────────────────────── */
function moverLuchador(p, ent){
  if (p.salud <= 0){ if (p.enSuelo > 0) p.enSuelo--; p.est = 'suelo'; return; }
  if (p.aturdido > 0){ p.aturdido--; p.est = 'herido'; return; }
  if (p.invul > 0) p.invul--;
  if (p.ataque > 0){ p.ataque--; if (p.ataque === 0) p.est = 'quieto'; return; }

  if (p.z > 0 || p.vz !== 0){
    p.vz -= 0.85; p.z += p.vz;
    if (p.z <= 0){ p.z = 0; p.vz = 0; p.est = 'quieto'; } else p.est = 'salto';
  } else if (ent.salto){ p.vz = 12; p.est = 'salto'; }

  const vx = (ent.der ? 1 : 0) - (ent.izq ? 1 : 0);
  const vy = (ent.abajo ? 1 : 0) - (ent.arriba ? 1 : 0);
  if (vx || vy){
    p.x += vx*3.2;
    p.y = Math.max(HONDO0, Math.min(HONDO1, p.y + vy*1.9));
    if (vx) p.dir = vx;
    if (p.z === 0) p.est = 'anda';
    p.marco += 0.22;
  } else if (p.z === 0 && p.est !== 'salto') p.est = 'quieto';

  p.x = Math.max(camX - W*0.42, Math.min(camX + W*0.44, p.x));

  if (ent.puno || ent.patada){
    const tipo = ent.puno ? 'puno' : 'patada';
    p.est = tipo; p.ataque = tipo === 'puno' ? 12 : 16;
    emitirGolpe(p, tipo);
  }
}

/** Publica el golpe. El anfitrión lo aplica; los demás lo mandan por la red. */
function emitirGolpe(p, tipo){
  const g = { n:++nGolpe, x:p.x, y:p.y, z:p.z, d:p.dir, t:tipo };
  if (anfitrion){
    const acerto = golpeAEnemigos(g);
    sacudida = Math.max(sacudida, tipo === 'patada' ? 6 : 4);
    if (acerto) tipo === 'patada' ? sonido.patada() : sonido.golpe();
    else sonido.fallo();
  } else {
    sonido.fallo();
    sala.escribir('estado/golpes/' + miRol, g);
  }
}

let puedenAtacar = new Set();
function rankAtaque(){
  const vivos = enemigos.filter(x => x.v > 0);
  const jug = roles().map(r => mios[r]).filter(p => p && p.salud > 0);
  if (!jug.length) return new Set();
  const dist = e => Math.min(...jug.map(p => Math.abs(p.x-e.x) + Math.abs(p.y-e.y)*2));
  const cupo = ATACANTES + (roles().length > 2 ? 1 : 0);
  return new Set(vivos.sort((a,b) => dist(a)-dist(b)).slice(0, cupo).map(x => x.i));
}

function moverEnemigo(e){
  if (e.v <= 0){ if (e.enSuelo > 0) e.enSuelo--; e.est = 'suelo'; return; }
  if (e.aturdido > 0){ e.aturdido--; return; }
  if (e.invul > 0) e.invul--;
  if (e.ataque > 0){ e.ataque--; if (e.ataque === 0) e.est = 'quieto'; return; }
  if (e.espera > 0) e.espera--;

  const d = TIPOS[e.t];
  const vivos = roles().map(r => mios[r]).filter(p => p && p.salud > 0);
  if (!vivos.length){ e.est = 'quieto'; return; }
  let obj = vivos[0], mejor = 1e9;
  for (const p of vivos){
    const dist = Math.abs(p.x - e.x) + Math.abs(p.y - e.y)*2;
    if (dist < mejor){ mejor = dist; obj = p; }
  }
  const dx = obj.x - e.x, dy = obj.y - e.y;

  // Solo unos pocos entran a pelear; el resto merodea esperando turno.
  if (!puedenAtacar.has(e.i)){
    const meta = obj.x + (e.x < obj.x ? -84 : 84);
    if (Math.abs(meta - e.x) > 8){ e.x += Math.sign(meta - e.x)*d.vel*0.7;
      e.est = 'anda'; e.marco += 0.16; }
    else e.est = 'quieto';
    e.dir = Math.sign(dx) || e.dir;
    return;
  }

  if (Math.abs(dx) < d.alcance && Math.abs(dy) < 20){
    if (e.espera <= 0){
      e.est = 'puno'; e.ataque = 18; e.espera = 48 + Math.random()*32;
      e.dir = dx >= 0 ? 1 : -1;
      golpeAJugadores(e);
      sonido.golpe();
    } else e.est = 'quieto';
  } else {
    if (Math.abs(dx) > d.alcance*0.8){ e.x += Math.sign(dx)*d.vel; e.dir = Math.sign(dx); }
    if (Math.abs(dy) > 4) e.y += Math.sign(dy)*d.vel*0.55;
    e.est = 'anda'; e.marco += 0.2;
  }
}

/* ── Bucle de juego ────────────────────────────────────── */
function paso(){
  const e = sala && sala.ultimo ? sala.ultimo.estado : null;
  if (!e || e.fase !== 'jugando') return;

  if (mios[miRol]) moverLuchador(mios[miRol], pulsa);

  if (anfitrion){
    // Golpes que llegan de los compañeros
    if (e.golpes) for (const r of roles()){
      const g = e.golpes[r];
      if (r !== miRol && g && g.n > (vistos[r] || 0)){
        vistos[r] = g.n;
        const acerto = golpeAEnemigos(g);
        if (acerto) g.t === 'patada' ? sonido.patada() : sonido.golpe();
      }
    }

    puedenAtacar = rankAtaque();
    enemigos.forEach(moverEnemigo);
    enemigos = enemigos.filter(x => x.v > 0 || x.enSuelo > 0);

    if (!enemigos.some(x => x.v > 0)){
      oleada++;
      if (oleada >= 3){
        oleada = 0; zona++;
        if (zona >= ZONAS){ terminar(true); return; }
        aviso('Zona ' + (zona+1));
        sala.escribir('estado/zona', zona);
      } else aviso('¡Vienen más!');
      sonido.avance();
      enemigos = generarOleada(zona, oleada);
    }

    // Vidas
    for (const r of roles()){
      const p = mios[r];
      if (!p || p.salud > 0 || p.enSuelo > 0) continue;
      const v = (e.vidas && e.vidas[r]) ?? 3;
      if (v > 1){
        sala.escribir('estado/vidas/' + r, v - 1);
        p.salud = 100; p.invul = 90; p.est = 'quieto'; p.x = camX; p.y = 60;
        if (!soloLocal) sala.escribir('estado/salud/' + r, 100);
      } else {
        sala.escribir('estado/vidas/' + r, 0);
        if (roles().every(o => ((e.vidas && e.vidas[o]) ?? 3) <= 1 &&
                               (!mios[o] || mios[o].salud <= 0))) terminar(false);
      }
    }
  }

  const vivos = roles().map(r => mios[r]).filter(p => p && p.salud > 0);
  if (vivos.length) camX += (Math.max(...vivos.map(p => p.x)) - camX)*0.06;
  if (sacudida > 0.2) sacudida *= 0.85;
  chispas.forEach(c => c.v--);
  chispas = chispas.filter(c => c.v > 0);
}

function terminar(gano){
  corriendo = false;
  sala.actualizar(s => { s.estado.fase = 'fin'; s.estado.ganador = gano ? 'jugadores' : 'calle'; });
}

function aviso(txt){
  $('aviso').textContent = txt;
  $('aviso').classList.add('ver');
  avisoHasta = performance.now() + 1600;
}

/* ── Dibujo del escenario ──────────────────────────────── */
const escY = y => H*0.52 + y*1.6;
const escala = y => 0.78 + (y/HONDO1)*0.34;
const aPantalla = (x, y, z) => [ x - camX + W/2, escY(y) - z*escala(y) ];

function dibujarFondo(){
  const g = cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#181042'); g.addColorStop(0.55,'#3B2168'); g.addColorStop(1,'#4A2A5E');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);
  cx.fillStyle = 'rgba(255,232,180,.85)';
  cx.beginPath(); cx.arc(W*0.8, H*0.14, 26, 0, 7); cx.fill();

  for (const [f, col, alt] of [[0.12,'#1E1440',0.30],[0.28,'#2A1B52',0.22]]){
    for (let i = -2; i < 22; i++){
      const bx = ((i*120 - camX*f) % (W+360) + W+360) % (W+360) - 180;
      const bh = H*alt*(0.6 + ((i*37)%10)/14);
      cx.fillStyle = col;
      cx.fillRect(bx, H*0.52 - bh, 96, bh);
      cx.fillStyle = 'rgba(255,201,74,.14)';
      for (let vy = 0; vy < bh-18; vy += 22)
        for (let vx = 0; vx < 4; vx++)
          if (((i*7+vy+vx*3) % 5) < 2) cx.fillRect(bx+10+vx*20, H*0.52-bh+10+vy, 9, 11);
    }
  }

  cx.fillStyle = '#2C2140'; cx.fillRect(0, escY(HONDO0)-26, W, 26);
  cx.fillStyle = '#3A2C52'; cx.fillRect(0, escY(HONDO0)-30, W, 5);
  const gs = cx.createLinearGradient(0, escY(HONDO0), 0, H);
  gs.addColorStop(0,'#241B36'); gs.addColorStop(1,'#171025');
  cx.fillStyle = gs; cx.fillRect(0, escY(HONDO0), W, H);
  cx.strokeStyle = 'rgba(255,255,255,.07)'; cx.lineWidth = 3;
  cx.setLineDash([40,46]); cx.lineDashOffset = -camX*0.9;
  cx.beginPath(); cx.moveTo(0, escY(HONDO1*0.72)); cx.lineTo(W, escY(HONDO1*0.72)); cx.stroke();
  cx.setLineDash([]);

  for (let i = -1; i < 14; i++){
    const fx = i*380 - (camX % 380);
    if (fx < -60 || fx > W+60) continue;
    cx.fillStyle = '#2A2140'; cx.fillRect(fx, escY(HONDO0)-150, 6, 150);
    cx.fillStyle = '#FFE9A8'; cx.beginPath(); cx.arc(fx+3, escY(HONDO0)-152, 7, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,233,168,.07)';
    cx.beginPath(); cx.moveTo(fx+3, escY(HONDO0)-150);
    cx.lineTo(fx-46, H); cx.lineTo(fx+52, H); cx.closePath(); cx.fill();
  }
}

/* ── Dibujo de los peleadores ──────────────────────────────
   Cada miembro es un polígono que se estrecha hacia el extremo,
   con contorno oscuro: así se leen como sprites de arcade y no
   como palitos. Las poses salen de mover unos pocos puntos. */
function hueso(ax, ay, bx, by, w1, w2, col, sombra){
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  cx.beginPath();
  cx.moveTo(ax + nx*w1, ay + ny*w1);
  cx.lineTo(bx + nx*w2, by + ny*w2);
  cx.lineTo(bx - nx*w2, by - ny*w2);
  cx.lineTo(ax - nx*w1, ay - ny*w1);
  cx.closePath();
  cx.fillStyle = col; cx.fill(); cx.stroke();
  // Un filo de luz en el borde superior da volumen al miembro
  if (sombra){
    cx.save(); cx.clip();
    cx.fillStyle = 'rgba(255,255,255,.16)';
    cx.beginPath();
    cx.moveTo(ax + nx*w1, ay + ny*w1);
    cx.lineTo(bx + nx*w2, by + ny*w2);
    cx.lineTo(bx + nx*w2*0.2, by + ny*w2*0.2);
    cx.lineTo(ax + nx*w1*0.2, ay + ny*w1*0.2);
    cx.closePath(); cx.fill();
    cx.restore();
  }
}

/** Músculo: dos curvas que se abomban hacia fuera. */
function musculo(ax, ay, bx, by, w, col){
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L, mx = (ax+bx)/2, my = (ay+by)/2;
  cx.beginPath();
  cx.moveTo(ax, ay);
  cx.quadraticCurveTo(mx + nx*w*1.5, my + ny*w*1.5, bx, by);
  cx.quadraticCurveTo(mx - nx*w*1.1, my - ny*w*1.1, ax, ay);
  cx.closePath();
  cx.fillStyle = col; cx.fill(); cx.stroke();
}

function dibujarPersona(o, look, etiqueta){
  const [sx, sy] = aPantalla(o.x, o.y, o.z);
  if (sx < -110 || sx > W+110) return;
  const s = escala(o.y)*1.34*(look.ancho || 1);

  const [ssx, ssy] = aPantalla(o.x, o.y, 0);
  cx.fillStyle = 'rgba(0,0,0,.45)';
  cx.beginPath(); cx.ellipse(ssx, ssy, 18*s, 6*s, 0, 0, 7); cx.fill();

  cx.save();
  cx.translate(sx, sy);
  cx.scale(o.dir*s, s);
  if (o.invul > 0 && Math.floor(o.invul/3)%2) cx.globalAlpha = .45;
  if (o.est === 'suelo'){ cx.rotate(-Math.PI/2); cx.translate(-18, 6); }

  cx.lineWidth = 1.7; cx.lineJoin = 'round';
  cx.strokeStyle = '#120B24';
  const piel = look.piel, ropa = look.ropa, pant = look.pant;
  const oscuro = look.oscuro || 'rgba(0,0,0,.3)';
  const t = o.marco, anda = o.est === 'anda';
  const bal = anda ? Math.sin(t)*10 : 0;
  const resp = o.est === 'quieto' ? Math.sin(t*0.05)*1.1 : 0;

  /* ── Piernas: muslo grueso, pantorrilla y bota ── */
  function pierna(caderaX, rodX, rodY, pieX, pieY, atras){
    const c = atras ? oscuro : pant;
    hueso(caderaX, -26, rodX, rodY, 7.5, 5.5, c, !atras);
    hueso(rodX, rodY, pieX, pieY, 5.5, 4.2, c, !atras);
    // Bota
    cx.fillStyle = atras ? 'rgba(0,0,0,.45)' : '#1E1730';
    cx.beginPath();
    cx.roundRect(pieX - 5, pieY - 3.5, 12, 5.5, 2);
    cx.fill(); cx.stroke();
  }

  if (o.est === 'patada'){
    pierna(-2, -8, -13, -6, -1, true);
    pierna(-1, 16, -26, 33, -26, false);
  } else if (o.est === 'salto'){
    pierna(-2, -11, -16, -3, -11, true);
    pierna(2, 13, -17, 20, -7, false);
  } else {
    pierna(-3, -4+bal*0.5, -13, -6+bal, -1, true);
    pierna(3, 4-bal*0.5, -13, 6-bal, -1, false);
  }

  /* ── Torso: pecho ancho, cintura estrecha ── */
  const hy = -47 + resp;
  cx.beginPath();
  cx.moveTo(-12.5, -50+resp);
  cx.quadraticCurveTo(0, -53+resp, 12.5, -50+resp);
  cx.lineTo(8.5, -32); cx.quadraticCurveTo(0, -29, -8.5, -32);
  cx.closePath();
  const gt = cx.createLinearGradient(-12, -50, 12, -30);
  gt.addColorStop(0, ropa); gt.addColorStop(1, oscuro);
  cx.fillStyle = gt; cx.fill(); cx.stroke();
  // Pectorales
  cx.strokeStyle = 'rgba(0,0,0,.28)'; cx.lineWidth = 1.2;
  cx.beginPath(); cx.moveTo(0, -49+resp); cx.lineTo(0, -40); cx.stroke();
  cx.beginPath(); cx.arc(-5, -43+resp, 4.6, 0.2, 2.6); cx.stroke();
  cx.beginPath(); cx.arc(5, -43+resp, 4.6, 0.5, 2.9); cx.stroke();
  cx.strokeStyle = '#120B24'; cx.lineWidth = 1.7;
  // Chaleco abierto
  if (look.chaleco){
    cx.fillStyle = look.chaleco;
    cx.beginPath();
    cx.moveTo(-12.5,-50+resp); cx.lineTo(-5,-50+resp);
    cx.lineTo(-4,-33); cx.lineTo(-8.5,-32); cx.closePath(); cx.fill(); cx.stroke();
    cx.beginPath();
    cx.moveTo(12.5,-50+resp); cx.lineTo(5,-50+resp);
    cx.lineTo(4,-33); cx.lineTo(8.5,-32); cx.closePath(); cx.fill(); cx.stroke();
  }
  // Abdomen y cinturón
  hueso(0, -34, 0, -27, 8, 8.5, piel, true);
  cx.strokeStyle = 'rgba(0,0,0,.3)'; cx.lineWidth = 1;
  for (const yy of [-33, -30]){
    cx.beginPath(); cx.moveTo(-5, yy); cx.lineTo(5, yy); cx.stroke();
  }
  cx.strokeStyle = '#120B24'; cx.lineWidth = 1.7;
  cx.fillStyle = '#241A38';
  cx.beginPath(); cx.roundRect(-9,-29.5, 18, 5, 1.5); cx.fill(); cx.stroke();
  cx.fillStyle = look.hebilla || '#E8C25C';
  cx.beginPath(); cx.roundRect(-2.5,-30, 5.5, 6, 1.5); cx.fill(); cx.stroke();

  /* ── Brazos con bíceps y puños vendados ── */
  function puno(x, y, r){
    cx.fillStyle = piel;
    cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); cx.stroke();
    cx.strokeStyle = look.venda || '#F3ECFF'; cx.lineWidth = 2.1;
    cx.beginPath(); cx.moveTo(x-r*0.9, y-1.4); cx.lineTo(x+r*0.9, y-1.4); cx.stroke();
    cx.beginPath(); cx.moveTo(x-r*0.9, y+1.6); cx.lineTo(x+r*0.9, y+1.6); cx.stroke();
    cx.strokeStyle = '#120B24'; cx.lineWidth = 1.7;
  }
  function brazo(hx, hy0, cx1, cy1, mx, my, atras){
    const c = atras ? oscuro : piel;
    musculo(hx, hy0, cx1, cy1, 3.4, c);
    hueso(cx1, cy1, mx, my, 4.4, 3.6, c, !atras);
    puno(mx, my, atras ? 4.2 : 5);
  }

  if (o.est === 'puno'){
    brazo(-6, hy, -12, hy+8, -14, hy+12, true);
    brazo(6, hy, 20, hy+1, 33, hy+2, false);
    // Ráfaga de velocidad tras el puño
    cx.strokeStyle = 'rgba(255,233,168,.75)'; cx.lineWidth = 2;
    for (const dy of [-4, 0, 4]){
      cx.beginPath(); cx.moveTo(16, hy+2+dy); cx.lineTo(26, hy+2+dy); cx.stroke();
    }
    cx.strokeStyle = '#120B24'; cx.lineWidth = 1.7;
  } else if (o.est === 'patada'){
    brazo(-6, hy, -14, hy-4, -19, hy-9, true);
    brazo(6, hy, 15, hy-6, 19, hy-13, false);
  } else if (o.est === 'herido'){
    brazo(-6, hy, -13, hy-6, -16, hy-13, true);
    brazo(6, hy, 13, hy-8, 15, hy-16, false);
  } else if (o.est === 'salto'){
    brazo(-6, hy, -13, hy-5, -17, hy-12, true);
    brazo(6, hy, 14, hy-4, 19, hy-11, false);
  } else {
    // Guardia alta de boxeador
    brazo(-6, hy, -12, hy+6+bal*0.3, -9, hy-4, true);
    brazo(6, hy, 12, hy+6-bal*0.3, 15, hy-5, false);
  }

  /* ── Cuello y cabeza ── */
  hueso(0, -50+resp, 0, -55+resp, 5, 5, piel, true);
  cx.beginPath();
  cx.moveTo(-7.5, -57+resp);
  cx.quadraticCurveTo(-8.5, -63+resp, -7, -68+resp);
  cx.quadraticCurveTo(0, -74+resp, 7, -68+resp);
  cx.quadraticCurveTo(9, -62+resp, 7.5, -57+resp);
  cx.quadraticCurveTo(2, -53+resp, -3, -55+resp);
  cx.closePath();
  const gc = cx.createLinearGradient(-8, -70, 8, -55);
  gc.addColorStop(0, '#FFFFFF22'); gc.addColorStop(0.25, piel); gc.addColorStop(1, oscuro);
  cx.fillStyle = gc; cx.fill(); cx.stroke();
  // Oreja y mandíbula
  cx.beginPath(); cx.arc(-4, -61+resp, 2.2, 0, 7); cx.fillStyle = piel; cx.fill(); cx.stroke();

  if (look.tipoPelo === 'cresta'){
    cx.fillStyle = look.pelo;
    cx.beginPath(); cx.moveTo(-6,-69+resp);
    cx.lineTo(-3,-82+resp); cx.lineTo(0,-71+resp);
    cx.lineTo(3,-83+resp); cx.lineTo(6,-70+resp);
    cx.lineTo(7,-66+resp); cx.lineTo(-7,-66+resp);
    cx.closePath(); cx.fill(); cx.stroke();
  } else if (look.tipoPelo === 'calvo'){
    cx.fillStyle = 'rgba(255,255,255,.16)';
    cx.beginPath(); cx.ellipse(0.5,-69+resp, 6,3.4, 0,0,7); cx.fill();
    cx.strokeStyle = 'rgba(0,0,0,.35)';
    cx.beginPath(); cx.arc(-2,-63+resp, 3, 0.6, 2.4); cx.stroke();   // ceja dura
    cx.strokeStyle = '#120B24';
  } else if (look.tipoPelo === 'gafas'){
    cx.fillStyle = look.pelo;
    cx.beginPath();
    cx.moveTo(-8,-67+resp); cx.quadraticCurveTo(0,-77+resp,8,-67+resp);
    cx.lineTo(8,-71+resp); cx.quadraticCurveTo(0,-80+resp,-8,-71+resp);
    cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle = '#0E0820';
    cx.beginPath(); cx.roundRect(-1,-65+resp, 9.5, 5, 1.5); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.5)';
    cx.fillRect(5,-64.4+resp, 2.5, 1.4);
  } else {
    // Pelo y cinta de guerrero
    cx.fillStyle = '#2E2450';
    cx.beginPath();
    cx.moveTo(-7.6,-66+resp); cx.quadraticCurveTo(0,-76+resp,7.6,-66+resp);
    cx.quadraticCurveTo(0,-70+resp,-7.6,-66+resp); cx.closePath();
    cx.fill(); cx.stroke();
    cx.fillStyle = look.pelo;
    cx.beginPath(); cx.roundRect(-8.2,-67+resp, 16.4, 5, 1.5); cx.fill(); cx.stroke();
    cx.beginPath();
    cx.moveTo(-8,-65.5+resp); cx.lineTo(-19,-59+resp + bal*0.35);
    cx.lineTo(-18,-63.5+resp + bal*0.35); cx.closePath(); cx.fill(); cx.stroke();
  }

  // Cara
  cx.fillStyle = '#241A38';
  cx.beginPath(); cx.ellipse(4,-61.5+resp, 1.7, 2.1, 0, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.5)'; cx.lineWidth = 1.3;
  cx.beginPath(); cx.moveTo(2,-64.6+resp); cx.lineTo(6.6,-63.6+resp); cx.stroke();  // ceja
  if (o.est === 'herido' || o.est === 'suelo'){
    cx.beginPath(); cx.arc(4.6,-57.5+resp, 2, 0, Math.PI); cx.stroke();             // mueca
  } else if (o.est === 'puno' || o.est === 'patada'){
    cx.beginPath(); cx.moveTo(2.4,-57.5+resp); cx.lineTo(6.8,-57.5+resp); cx.stroke();
  }
  cx.strokeStyle = '#120B24'; cx.lineWidth = 1.7;

  cx.globalAlpha = 1;
  cx.restore();

  if (etiqueta){
    cx.fillStyle = look.ropa;
    cx.font = '700 13px "DM Sans", sans-serif'; cx.textAlign = 'center';
    cx.fillText(etiqueta, sx, sy - 96*s);
  }
}

const OSCURO = { A:'#2E5AA8', B:'#A83E3E', C:'#3E9B5E', D:'#A88A2E' };
const LOOK_J = r => ({ ropa: COL_J[r] || '#6FA8FF', oscuro: OSCURO[r] || '#2E5AA8',
                       piel:'#F0C9A0', pant:'#2E2450', pelo:'#F3ECFF',
                       venda:'#F3ECFF', tipoPelo:'cinta', ancho:1, hebilla:'#E8C25C' });
const LOOK_E = {
  maton: { ropa:TIPOS.maton.col, oscuro:'#5E3A85', piel:'#D9A97F', pant:'#3A2A4E',
           pelo:TIPOS.maton.pelo, tipoPelo:'cresta', venda:'#D9A97F', ancho:0.95 },
  bruto: { ropa:TIPOS.bruto.col, oscuro:'#7A4A22', piel:'#C98F63', pant:'#4A3320',
           pelo:'#3A2A22', tipoPelo:'calvo', venda:'#C98F63', ancho:1.32,
           chaleco:'#6B4326', hebilla:'#B08A3A' },
  jefe:  { ropa:TIPOS.jefe.col, oscuro:'#7A2440', piel:'#E0B48C', pant:'#241830',
           pelo:'#1B1233', tipoPelo:'gafas', venda:'#E0B48C', ancho:1.14,
           chaleco:'#7A1E3C', hebilla:'#E8C25C' }
};

function barraEnemigo(e){
  if (e.v <= 0 || e.v >= e.vmax) return;
  const [sx, sy] = aPantalla(e.x, e.y, e.z);
  const s = escala(e.y);
  cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(sx-18, sy-98*s, 36, 5);
  cx.fillStyle = e.v/e.vmax > 0.35 ? '#FFC94A' : '#FF7B7B';
  cx.fillRect(sx-18, sy-98*s, 36*(e.v/e.vmax), 5);
}

function dibujar(){
  cx.save();
  if (sacudida > 0.2) cx.translate((Math.random()-0.5)*sacudida, (Math.random()-0.5)*sacudida);
  dibujarFondo();

  const orden = [];
  for (const r of roles()){
    const p = mios[r];
    if (p && (p.salud > 0 || p.enSuelo > 0))
      orden.push({ o:p, look:LOOK_J(r), eti: sala ? sala.nombre(r) : r });
  }
  for (const e of enemigos) orden.push({ o:e, look:LOOK_E[e.t], ene:true });
  orden.sort((a,b) => a.o.y - b.o.y);
  for (const it of orden){
    dibujarPersona(it.o, it.look, it.eti);
    if (it.ene) barraEnemigo(it.o);
  }

  for (const c of chispas){
    const [gx, gy] = aPantalla(c.x, c.y, c.z);
    cx.globalAlpha = c.v/12;
    cx.strokeStyle = '#FFE9A8'; cx.lineWidth = 3.4;
    for (let i = 0; i < 7; i++){
      const a = i*Math.PI/3.5;
      cx.beginPath();
      cx.moveTo(gx+Math.cos(a)*7, gy+Math.sin(a)*7);
      cx.lineTo(gx+Math.cos(a)*(19-c.v*0.6), gy+Math.sin(a)*(19-c.v*0.6));
      cx.stroke();
    }
    cx.globalAlpha = 1;
  }
  cx.restore();
}

/* ── HUD ───────────────────────────────────────────────── */
function hud(){
  const e = sala && sala.ultimo ? sala.ultimo.estado : null;
  if (!e) return;
  const cont = $('banda');
  const lista = roles();
  if (cont.childElementCount !== lista.length) cont.innerHTML = '';
  lista.forEach((r,k) => {
    let d = cont.children[k];
    if (!d){ d = document.createElement('div'); d.className = 'peleador'; cont.appendChild(d); }
    const p = mios[r];
    const s = p ? Math.max(0, Math.round(p.salud)) : ((e.salud && e.salud[r]) ?? 100);
    const v = (e.vidas && e.vidas[r]) ?? 3;
    const on = soloLocal ? true : sala.enLinea(r);
    d.className = 'peleador' + (r === miRol ? ' yo' : '') + (on ? '' : ' fuera');
    d.style.color = COL_J[r];
    d.innerHTML = '<div class="fila"><span class="nm">' + sala.nombre(r) +
                  (r === miRol ? ' (tú)' : '') + '</span>' +
                  '<span class="vd">' + ('♥'.repeat(Math.max(0,v)) || '—') + '</span></div>' +
                  '<div class="barra"><i style="width:' + s + '%"></i></div>';
  });
  $('hud-zona').textContent = (zona+1) + '/' + ZONAS;
}

let ultimoT = performance.now();
function bucle(ahora){
  requestAnimationFrame(bucle);
  try { cuadro(ahora); } catch(e){ mostrarFallo('bucle: ' + e.message); }
}

function cuadro(ahora){
  ultimoT = ahora;
  if (corriendo) paso();
  if (avisoHasta && ahora > avisoHasta){ $('aviso').classList.remove('ver'); avisoHasta = 0; }

  if (sala && corriendo && !soloLocal && ahora - ultimoEnvio > 90){
    ultimoEnvio = ahora;
    const p = mios[miRol];
    if (p) sala.escribir('estado/pos/' + miRol, {
      x:+p.x.toFixed(1), y:+p.y.toFixed(1), z:+p.z.toFixed(1),
      d:p.dir, e:p.est, m:+p.marco.toFixed(1)
    });
    if (anfitrion) sala.escribir('estado/enemigos', enemigos.map(e => ({
      i:e.i, t:e.t, x:+e.x.toFixed(1), y:+e.y.toFixed(1), z:+e.z.toFixed(1),
      d:e.dir, e:e.est, v:e.v, vm:e.vmax, m:+e.marco.toFixed(1)
    })));
  }

  dibujar();
  hud();
}

/* ── Sincronización ────────────────────────────────────── */
function pintar(s){
  const e = s && s.estado;
  if (!e) return;
  zona = e.zona || 0;

  if (!soloLocal){
    for (const r of roles()){
      if (r === miRol){
        // El anfitrión manda sobre mi salud
        if (!anfitrion && mios[r] && e.salud && e.salud[r] != null) mios[r].salud = e.salud[r];
        continue;
      }
      const q = e.pos && e.pos[r];
      if (!q) continue;
      if (!mios[r]) mios[r] = nuevoLuchador(q.x, q.y);
      const p = mios[r];
      p.x += (q.x - p.x)*0.35; p.y += (q.y - p.y)*0.35; p.z = q.z;
      p.dir = q.d; p.est = q.e; p.marco = q.m;
      if (e.salud && e.salud[r] != null) p.salud = e.salud[r];
    }
    if (!anfitrion && e.enemigos){
      enemigos = e.enemigos.map(x => ({
        i:x.i, t:x.t, x:x.x, y:x.y, z:x.z, dir:x.d, est:x.e, v:x.v, vmax:x.vm,
        marco:x.m, invul:0, aturdido:0, enSuelo: x.v <= 0 ? 1 : 0
      }));
    }
  }

  if (e.fase === 'jugando' && !corriendo && !finalMostrado) arrancar(e);
  if (e.fase === 'fin' && !finalMostrado){
    finalMostrado = true; corriendo = false;
    const gano = e.ganador === 'jugadores';
    capa(gano ? '🏆 ¡Calle despejada!' : '💀 Los tumbaron',
         gano ? 'Limpiaron las ' + ZONAS + ' zonas. El barrio es suyo.'
              : 'Se quedaron sin vidas. La banda sigue mandando.',
         'Otra vez');
    gano ? sonido.victoria() : sonido.derrota();
  }
}

function arrancar(e){
  zona = e.zona || 0; oleada = 0; camX = 0; contadorId = 1;
  mios = {}; vistos = {}; nGolpe = 0;
  roles().forEach((r,k) => { mios[r] = nuevoLuchador(-70 + k*60, 35 + k*22); });
  enemigos = anfitrion ? generarOleada(zona, 0) : [];
  corriendo = true; finalMostrado = false;
  $('capa').classList.add('oculta');
  aviso('Zona ' + (zona+1));
}

function capa(t, s, b){
  $('capa-t').textContent = t; $('capa-s').textContent = s; $('capa-b').textContent = b;
  $('capa').classList.remove('oculta');
}

$('capa-b').addEventListener('click', () => {
  finalMostrado = false;
  sala.actualizar(s => {
    const e = s.estado;
    e.fase = 'jugando'; e.zona = 0; e.ganador = '';
    e.vidas = {}; e.salud = {}; e.enemigos = []; e.pos = {}; e.golpes = {};
    for (const r of roles()){ e.vidas[r] = 3; e.salud[r] = 100; }
  });
});

/* ── Arranque ──────────────────────────────────────────── */
requestAnimationFrame(bucle);

// Al volver al catálogo liberamos el puesto: si no, la sala queda
// con un jugador fantasma hasta que Firebase note la desconexión.
document.querySelector('a.inicio').addEventListener('click', () => {
  try { if (sala && sala.salir) sala.salir(); } catch(e){}
});

new Lobby({
  juego: 'furia',
  titulo: 'Furia <em>callejera</em>',
  lema: '¿Entras solo o llaman a la pandilla?',
  maxJugadores: MAX_J,
  textoOnline: 'En línea · de 2 a 4 jugadores',
  textoSolo: '🥊 Un jugador · tú contra la banda',
  tituloNivel: '¿Qué tan <em>brava</em> la banda?',
  lemaNivel: 'Elige a qué te enfrentas.',
  niveles: [
    { n:1, t:'Pandilla floja',  d:'Pegan poco y son pocos. Para calentar.' },
    { n:2, t:'Pandilla',        d:'El reto justo. La mitad de las veces se pasa.' },
    { n:3, t:'Pandilla brava',  d:'Más matones y pegan durísimo. Casi imposible solo.' }
  ],
  estadoInicial,
  nombreRobot: n => NIVEL[n].nombre,
  alEntrar: s => {
    sala = s; miRol = s.rol; anfitrion = (miRol === 'A'); soloLocal = false;
    s.alCambiar(pintar);
    s.alJugador((r, q) => aviso(s.nombre(r) + (q === 'entra' ? ' se unió' : ' salió')));
    capa('Furia callejera',
         'Golpea, patea y salta. Limpien las ' + ZONAS + ' zonas antes de quedarse sin vidas. ' +
         'Pueden sumarse hasta ' + MAX_J + '.', 'Empezar');
  },
  alSolo: (s, n) => {
    sala = s; miRol = 'A'; anfitrion = true; soloLocal = true; nivel = n;
    // En solitario la sala vive en memoria: el rol B no participa
    s.ultimo.jugadores = { A: s.ultimo.jugadores.A };
    s.alCambiar(pintar);
    capa('Tú contra la banda',
         'Tres zonas, tres oleadas cada una y un jefe al final. Dificultad: ' +
         NIVEL[n].nombre.toLowerCase() + '.', 'Empezar');
  }
});
</script>

<script>
// Si un módulo no carga (por ejemplo, un archivo que falta en el servidor),
// el navegador no ejecuta nada y la página queda en negro sin explicación.
// Esto lo convierte en un mensaje legible.
window.addEventListener('load', () => setTimeout(() => {
  const l = document.getElementById('lobby');
  if (l && l.children.length) return;
  const faltan = ['lobby.js','sala.js','sala-local.js','sonido.js','config.js','estilo.css'];
  Promise.all(faltan.map(f =>
    fetch(f, {cache:'no-store'}).then(r => r.ok ? null : f).catch(() => f)
  )).then(res => {
    const rotos = res.filter(Boolean);
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:999;display:grid;place-content:center;' +
      'gap:10px;padding:24px;text-align:center;background:#241634;color:#F3ECFF;' +
      'font-family:system-ui,sans-serif';
    d.innerHTML = '<h2 style="font-size:20px">El juego no pudo cargar</h2>' +
      (rotos.length
        ? '<p style="color:#FF7B7B;font-size:14px">Faltan estos archivos en el servidor:<br><b>' +
          rotos.join('<br>') + '</b></p><p style="font-size:13px;color:#A794C4">Súbelos al repositorio y recarga con Ctrl+Shift+R.</p>'
        : '<p style="font-size:14px;color:#A794C4">Los archivos están, pero el navegador guarda una versión vieja.<br>' +
          'Recarga forzando la caché: <b>Ctrl+Shift+R</b> en PC, o cierra la pestaña y vuelve a abrirla en el celular.</p>') +
      '<a href="index.html" style="color:#FFC94A;font-size:13px">◀ Volver a la sala de juegos</a>';
    document.body.appendChild(d);
  });
}, 2500));
</script>
